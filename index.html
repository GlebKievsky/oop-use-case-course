<!doctype html>
<html lang="uk" class="no-anim">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5fb">
<script>
  /* Тема встановлюється до першого малювання — без блимання */
  (function () {
    var pref = 'system';
    try { pref = localStorage.getItem('ucCourse.theme') || 'system'; } catch (e) {}
    var dark = pref === 'dark' || (pref !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var root = document.documentElement;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.style.colorScheme = dark ? 'dark' : 'light';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#0b0c12' : '#f6f5fb');
  })();
</script>
<title>Use Case з нуля — курс з діаграм варіантів використання UML</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* ================= Токени ================= */
:root{
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Unbounded","Manrope",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  --r-sm:10px;--r:14px;--r-lg:20px;--r-xl:28px;
  --ease:cubic-bezier(.22,.7,.2,1);
  --sidebar-w:300px;--topbar-h:64px;
}
:root,:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f5fb;--bg-glow-1:rgba(124,92,240,.15);--bg-glow-2:rgba(45,212,191,.13);--dot:rgba(70,60,130,.11);
  --surface:#ffffff;--surface-2:#f5f3fc;--surface-3:#ece9f7;--glass:rgba(255,255,255,.74);
  --border:#e7e4f2;--border-strong:#d5d0e8;
  --text:#1c1933;--text-2:#4a4666;--text-3:#767298;
  --accent:#6d4aff;--accent-hover:#5a36f2;--accent-soft:#efeaff;--accent-text:#5634e6;--on-accent:#fff;
  --grad:linear-gradient(135deg,#7c5cff 0%,#5b7cff 52%,#22c3b0 115%);
  --ok:#11804a;--ok-soft:#e7f7ee;--ok-border:#a9e2c2;
  --bad:#d01f45;--bad-soft:#fdecf0;--bad-border:#f4b6c4;
  --warn:#a85a06;--warn-soft:#fff5e3;--warn-border:#f3d29b;
  --c-actor:#6f4fe6;--c-actor-soft:#f1edff;--c-actor-line:#a78bfa;
  --c-uc:#0b7f75;--c-uc-soft:#e6faf5;--c-uc-line:#2dd4bf;
  --c-boundary:#b4219f;--c-boundary-soft:#fcefff;--c-boundary-line:#e879f9;
  --c-inc:#0874b8;--c-inc-soft:#e6f5fd;--c-inc-line:#38bdf8;
  --c-ext:#c2470a;--c-ext-soft:#fff1e6;--c-ext-line:#fb923c;
  --c-gen:#3f4b5e;--c-gen-soft:#eef1f6;
  --shadow-sm:0 1px 2px rgba(28,25,51,.06),0 1px 1px rgba(28,25,51,.04);
  --shadow:0 12px 32px -14px rgba(46,32,120,.20),0 2px 6px rgba(28,25,51,.05);
  --shadow-lg:0 30px 70px -24px rgba(46,32,120,.32);
  --focus:0 0 0 3px rgba(109,74,255,.38);
  --skeleton:linear-gradient(90deg,#efecf8 0%,#faf9ff 50%,#efecf8 100%);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0c12;--bg-glow-1:rgba(124,92,240,.20);--bg-glow-2:rgba(45,212,191,.09);--dot:rgba(205,200,255,.075);
  --surface:#13141d;--surface-2:#181925;--surface-3:#212234;--glass:rgba(17,18,27,.74);
  --border:#25263a;--border-strong:#34364f;
  --text:#ecebf7;--text-2:#b9b7d0;--text-3:#8a88a6;
  --accent:#8b74ff;--accent-hover:#9d8aff;--accent-soft:#211b3f;--accent-text:#b3a4ff;--on-accent:#fff;
  --grad:linear-gradient(135deg,#8b74ff 0%,#5b7cff 52%,#22c3b0 115%);
  --ok:#4ade80;--ok-soft:#0f2519;--ok-border:#1d5434;
  --bad:#fb7185;--bad-soft:#2a1119;--bad-border:#5e2233;
  --warn:#fbbf24;--warn-soft:#291f0a;--warn-border:#5c4413;
  --c-actor:#b9a7ff;--c-actor-soft:#211b3d;--c-actor-line:#a78bfa;
  --c-uc:#4fe0cb;--c-uc-soft:#0e2926;--c-uc-line:#2dd4bf;
  --c-boundary:#f09bfb;--c-boundary-soft:#2a1530;--c-boundary-line:#e879f9;
  --c-inc:#5cc9fa;--c-inc-soft:#0b2333;--c-inc-line:#38bdf8;
  --c-ext:#fda15f;--c-ext-soft:#2d190b;--c-ext-line:#fb923c;
  --c-gen:#d3dae6;--c-gen-soft:#1f2531;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow:0 14px 34px -16px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.015);
  --shadow-lg:0 30px 70px -24px rgba(0,0,0,.8);
  --focus:0 0 0 3px rgba(139,116,255,.5);
  --skeleton:linear-gradient(90deg,#191a27 0%,#25263b 50%,#191a27 100%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){color-scheme:dark;--bg:#0b0c12;--surface:#13141d;--text:#ecebf7;--text-2:#b9b7d0;--border:#25263a}
}

/* ================= База ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--topbar-h) + 16px)}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:var(--font-ui);font-size:16px;line-height:1.62;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 8% -12%,var(--bg-glow-1),transparent 62%) no-repeat,
    radial-gradient(900px 520px at 104% -4%,var(--bg-glow-2),transparent 58%) no-repeat,
    radial-gradient(var(--dot) 1.1px,transparent 1.4px) 0 0/22px 22px}
.no-anim *,.no-anim *::before,.no-anim *::after,.theme-switching *,.theme-switching *::before,.theme-switching *::after{transition:none!important}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
img,svg{max-width:100%}
a{color:var(--accent-text);text-underline-offset:3px}
h1,h2,h3,h4{margin:0;line-height:1.2;color:var(--text)}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,3.4vw,38px);letter-spacing:-.02em}
h2{font-family:var(--font-display);font-weight:500;font-size:clamp(20px,2.3vw,25px);letter-spacing:-.015em}
h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
p{margin:0 0 .9em}
code,kbd,pre{font-family:var(--font-mono);font-size:.88em}
:where(button,a,input,select,textarea,[tabindex]):focus{outline:none}
:where(button,a,input,select,textarea,summary,[tabindex]):focus-visible{box-shadow:var(--focus);border-radius:var(--r-sm)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ico{display:inline-flex;flex:none;line-height:0}
.muted{color:var(--text-2)}
.subtle{color:var(--text-3)}
[hidden]{display:none!important}
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}

/* ================= Кнопки, поля ================= */
.btn{--h:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h);padding:0 18px;border-radius:12px;border:1px solid transparent;font:700 15px/1 var(--font-ui);letter-spacing:.005em;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .15s var(--ease),box-shadow .2s var(--ease),background-color .2s,border-color .2s,color .2s;-webkit-tap-highlight-color:transparent;user-select:none}
.btn:active{transform:translateY(1px) scale(.99)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{color:var(--on-accent);background:var(--grad);box-shadow:0 10px 22px -10px rgba(109,74,255,.75),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-primary:hover:not([disabled]){box-shadow:0 14px 28px -10px rgba(109,74,255,.85),inset 0 1px 0 rgba(255,255,255,.3);transform:translateY(-1px)}
.btn-secondary{color:var(--text);background:var(--surface);border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
.btn-secondary:hover:not([disabled]){border-color:var(--accent);color:var(--accent-text)}
.btn-ghost{color:var(--text-2);background:transparent}
.btn-ghost:hover:not([disabled]){background:var(--surface-3);color:var(--text)}
.btn-danger{color:#fff;background:var(--bad);box-shadow:0 10px 22px -12px var(--bad)}
.btn-sm{--h:36px;padding:0 13px;font-size:14px;border-radius:10px}
.btn-lg{--h:52px;padding:0 24px;font-size:16px;border-radius:14px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--text-2);cursor:pointer;transition:background-color .2s,color .2s,border-color .2s}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:14px;color:var(--text-2)}
.input,select.input{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:600 16px var(--font-ui);transition:border-color .2s,box-shadow .2s}
.input:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border-strong))}
.input:focus{border-color:var(--accent);box-shadow:var(--focus);border-radius:12px}
.input.invalid{border-color:var(--bad)}
.field-error{font-size:13px;font-weight:600;color:var(--bad);min-height:18px}

/* ================= Каркас ================= */
.topbar{position:sticky;top:0;z-index:40;height:var(--topbar-h);display:flex;align-items:center;gap:10px;padding:0 clamp(12px,2vw,22px);background:var(--glass);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:11px;color:var(--text);text-decoration:none;min-width:0}
.brand-mark{flex:none;width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px -8px rgba(109,74,255,.7)}
.brand-text{display:grid;line-height:1.15;min-width:0}
.brand-text b{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand-text span{font-size:12px;color:var(--text-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.menu-btn{display:none}
.tb-progress{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:700;color:var(--text-2)}
.tb-progress .bar{width:90px}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;background:var(--grad);transition:width .8s var(--ease)}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 9px;border:0;border-radius:9px;background:transparent;color:var(--text-3);font:700 13px var(--font-ui);cursor:pointer;transition:background-color .2s,color .2s,box-shadow .2s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-text);box-shadow:var(--shadow-sm)}
.avatar-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 4px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--text);cursor:pointer;font:700 14px var(--font-ui)}
.avatar-btn:hover{background:var(--surface-3)}
.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);font:800 13px var(--font-ui);letter-spacing:.02em}
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:calc(100dvh - var(--topbar-h))}
.sidebar{position:sticky;top:var(--topbar-h);height:calc(100dvh - var(--topbar-h));overflow:auto;padding:18px 14px 32px;border-right:1px solid var(--border);background:color-mix(in srgb,var(--surface) 52%,transparent)}
.main{min-width:0;padding:34px clamp(16px,4vw,52px) 96px}
.page{max-width:860px;margin:0 auto}
.page.wide{max-width:1120px}
.view-enter{animation:viewIn .42s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:var(--topbar-h) 0 0 0;background:rgba(10,8,25,.42);z-index:44;opacity:0;pointer-events:none;transition:opacity .25s}
.app.focus .shell{grid-template-columns:minmax(0,1fr)}
.app.focus .sidebar,.app.focus .menu-btn,.app.focus .tb-progress{display:none!important}

/* ================= Бічна панель ================= */
.side-progress{padding:14px 14px 16px;margin-bottom:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.side-progress .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;font-size:13px;font-weight:700;color:var(--text-2)}
.side-progress .row b{font-family:var(--font-display);font-size:18px;color:var(--text)}
.side-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;color:var(--text-2);text-decoration:none;font-weight:700;font-size:14.5px;transition:background-color .2s,color .2s}
.side-link:hover{background:var(--surface-3);color:var(--text)}
.side-link.active{background:var(--accent-soft);color:var(--accent-text)}
.side-link .tail{margin-left:auto;color:var(--text-3)}
.side-module{margin-top:16px}
.side-module-title{display:flex;align-items:center;gap:9px;padding:0 10px 6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.side-module-title .count{margin-left:auto;letter-spacing:0;font-weight:700}
.mod-num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--surface-3);color:var(--text-2);font-size:11px;letter-spacing:0}
.side-module ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.side-lesson{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;color:var(--text);text-decoration:none;font-size:14.5px;font-weight:600;line-height:1.3;transition:background-color .2s,color .2s}
.side-lesson:hover{background:var(--surface-3)}
.side-lesson .num{font-variant-numeric:tabular-nums;color:var(--text-3);font-weight:700;font-size:13px;min-width:24px}
.side-lesson .st{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--border-strong);color:transparent}
.side-lesson.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.side-lesson.current{background:var(--accent-soft)}
.side-lesson.current:not(.done) .st{border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 10px var(--accent)}
.side-lesson.locked{color:var(--text-3);cursor:not-allowed}
.side-lesson.locked .st{border-style:dashed;color:var(--text-3);border-color:var(--border-strong)}
.side-sep{height:1px;background:var(--border);margin:18px 6px 10px}

@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-grid}
  .sidebar{position:fixed;left:0;top:var(--topbar-h);bottom:0;height:auto;width:min(88vw,340px);z-index:45;background:var(--surface);transform:translateX(-104%);transition:transform .32s var(--ease);box-shadow:var(--shadow-lg)}
  .app.nav-open .sidebar{transform:none}
  .app.nav-open .scrim{opacity:1;pointer-events:auto}
  .tb-progress{display:none}
}
@media (max-width:560px){
  .brand-text span{display:none}
  .seg button span:not(.ico){display:none}
  .avatar-btn .name{display:none}
  .main{padding-top:22px}
  .step{padding:6px 8px 6px 6px;gap:7px;font-size:13px}
  .step .dot{width:24px;height:24px}
  .step-sep{display:none}
  .stepper{gap:4px}
  .theory{padding:18px}
  .prose{font-size:16.5px}
}
@media (max-width:440px){
  .brand-text{display:none}
  .topbar{gap:6px}
  .seg button{padding:0 8px}
}
/* ================= Картки, текст ================= */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:clamp(18px,3vw,28px)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:13px;font-weight:700;color:var(--text-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:var(--ok-border);color:var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad-border);color:var(--bad)}
.chip.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.prose{font-size:17px;line-height:1.72;color:var(--text)}
.prose p{margin:0 0 1em}
.prose ul,.prose ol{margin:0 0 1.1em;padding-left:1.3em}
.prose li{margin:.35em 0}
.prose li::marker{color:var(--accent);font-weight:800}
.prose h3{margin:1.4em 0 .5em}
.prose code{padding:.12em .4em;border-radius:6px;background:var(--surface-3);color:var(--text)}
.prose b,.prose strong{font-weight:800}
.t-actor,.t-uc,.t-boundary,.t-inc,.t-ext,.t-gen{font-weight:800;padding:.04em .38em;border-radius:7px;white-space:nowrap;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.t-actor{color:var(--c-actor);background:var(--c-actor-soft)}
.t-uc{color:var(--c-uc);background:var(--c-uc-soft)}
.t-boundary{color:var(--c-boundary);background:var(--c-boundary-soft)}
.t-inc{color:var(--c-inc);background:var(--c-inc-soft)}
.t-ext{color:var(--c-ext);background:var(--c-ext-soft)}
.t-gen{color:var(--c-gen);background:var(--c-gen-soft)}
.callout{position:relative;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:1.4em 0;padding:16px 18px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface-2);font-size:16px;line-height:1.6}
.callout>.ico{grid-row:span 2;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.callout h4{font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.callout p:last-child,.callout ul:last-child{margin-bottom:0}
.callout.remember{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.callout.remember>.ico{background:var(--accent);color:#fff}
.callout.remember h4{color:var(--accent-text)}
.callout.mistake{background:var(--bad-soft);border-color:var(--bad-border)}
.callout.mistake>.ico{background:var(--bad);color:#fff}
.callout.mistake h4{color:var(--bad)}
.callout.tip{background:var(--ok-soft);border-color:var(--ok-border)}
.callout.tip>.ico{background:var(--ok);color:#fff}
.callout.tip h4{color:var(--ok)}
.table-wrap{overflow-x:auto;margin:1.2em 0;border-radius:var(--r);border:1px solid var(--border);background:var(--surface)}
table.compare{width:100%;border-collapse:collapse;font-size:15px;line-height:1.45}
table.compare th,table.compare td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
table.compare tr:last-child td{border-bottom:0}
table.compare th{font-size:13px;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2)}
table.compare td:first-child{font-weight:700;color:var(--text-2);width:30%}

/* ================= Діаграми ================= */
.diagram{margin:1.5em 0;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden}
.diagram.compact{margin:12px 0 0;box-shadow:none}
.diagram-head{display:flex;align-items:center;gap:10px;padding:10px 12px 0 16px}
.diagram-head .title{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-right:auto}
.diagram-canvas{position:relative;display:flex;justify-content:center;align-items:center;min-height:150px;padding:18px clamp(8px,2vw,22px);overflow-x:auto;background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:18px 18px}
.diagram.compact .diagram-canvas{min-height:110px;padding:12px}
.diagram-canvas>svg{display:block;height:auto;margin:0 auto}
.diagram:not(.compact) .diagram-canvas>svg{min-width:min(100%,560px)}
.diagram.compact .diagram-canvas>svg{min-width:min(100%,380px)}
.diagram-canvas.is-rendering:empty::after,.diagram-canvas.is-rendering>.skeleton{content:"";display:block;width:min(100%,520px);height:150px;border-radius:16px;background:var(--skeleton);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.diagram-canvas.is-rendering>svg{opacity:.55;transition:opacity .2s}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.diagram figcaption{padding:10px 18px 14px;font-size:14px;color:var(--text-2);border-top:1px dashed var(--border)}
.diagram-tools{display:flex;gap:4px;margin-left:auto}
.diagram-tools .icon-btn{width:34px;height:34px;border-radius:10px}
.diagram-error{display:grid;gap:10px;justify-items:start;width:100%;max-width:640px;padding:16px;border-radius:14px;background:var(--warn-soft);border:1px solid var(--warn-border);color:var(--text);font-size:14.5px}
.diagram-error b{color:var(--warn)}
.code-panel{border-top:1px solid var(--border);background:var(--surface-2)}
.code-panel-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 0 16px;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
pre.code{margin:0;padding:12px 16px 16px;overflow-x:auto;font-size:13.5px;line-height:1.65;color:var(--text);tab-size:2}
.hl-k{color:var(--accent-text);font-weight:600}.hl-s{color:var(--c-uc)}.hl-o{color:var(--c-ext)}.hl-c{color:var(--text-3);font-style:italic}.hl-i{color:var(--c-inc);font-weight:600}
/* інтерактивні елементи SVG */
.diagram-canvas svg .uc-hot{cursor:pointer}
.diagram-canvas svg g.uc-hot{transition:filter .2s,opacity .25s}
.diagram-canvas svg g.uc-hot:hover,.diagram-canvas svg g.uc-hot:focus-visible{filter:drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 2px var(--accent))}
.diagram-canvas svg .uc-hit{fill:none!important;stroke:transparent!important;stroke-width:18px!important;pointer-events:stroke;cursor:pointer}
.diagram-canvas svg path:has(+ .uc-hit:hover),.diagram-canvas svg path:has(+ .uc-hit:focus-visible){stroke:var(--accent)!important;stroke-width:3px!important}
.diagram-canvas svg g.uc-ok{filter:drop-shadow(0 0 4px var(--ok)) drop-shadow(0 0 9px var(--ok))}
.diagram-canvas svg g.uc-bad{filter:drop-shadow(0 0 4px var(--bad)) drop-shadow(0 0 9px var(--bad))}
.diagram-canvas svg g.uc-focus{filter:drop-shadow(0 0 4px var(--accent)) drop-shadow(0 0 10px var(--accent))}
.diagram-canvas svg path.uc-ok{stroke:var(--ok)!important;stroke-width:3px!important}
.diagram-canvas svg path.uc-bad{stroke:var(--bad)!important;stroke-width:3px!important}
.diagram-canvas svg path.uc-focus{stroke:var(--accent)!important;stroke-width:3px!important}
.diagram-canvas svg .uc-dim{opacity:.18;transition:opacity .25s}
.diagram-canvas svg .uc-flash{animation:ucFlash .9s ease}
@keyframes ucFlash{0%,100%{opacity:1}30%{opacity:.35}60%{opacity:1}80%{opacity:.6}}
/* тимчасовий контейнер, у якому Mermaid вимірює текст під час рендеру, — за межами екрана */
body>div[id^="ducd"]{position:absolute!important;left:-10000px!important;top:0!important;width:100vw;visibility:hidden!important;pointer-events:none!important}
dialog.modal.diagram-full{width:min(1200px,96vw)}
dialog.modal.diagram-full .modal-body{display:flex;justify-content:center;overflow:auto;max-height:78vh;background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:18px 18px;border-radius:14px}
dialog.modal.diagram-full svg{max-width:none!important;width:auto;min-width:min(100%,700px);height:auto}

/* ================= Урок ================= */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--text-3);margin-bottom:12px}
.crumbs a{color:var(--text-3);text-decoration:none}
.crumbs a:hover{color:var(--accent-text)}
.lesson-head{margin-bottom:22px}
.lesson-head h1 .n{color:var(--accent-text);margin-right:.3em}
.lesson-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stepper{display:flex;align-items:center;gap:8px;margin:22px 0 26px;padding:6px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow-x:auto}
.step{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:12px;color:var(--text-3);font-weight:800;font-size:14px;text-decoration:none;white-space:nowrap;flex:1}
.step .dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-3);font-size:13px}
.step.active{background:var(--accent-soft);color:var(--accent-text)}
.step.active .dot{background:var(--accent);color:#fff}
.step.done{color:var(--ok)}
.step.done .dot{background:var(--ok);color:#fff}
a.step:hover{background:var(--surface-3)}
.step-sep{flex:none;width:18px;height:2px;border-radius:2px;background:var(--border-strong)}
.theory{padding:clamp(20px,3.5vw,38px)}
.theory-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:26px;padding-top:22px;border-top:1px solid var(--border)}
.lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.lesson-nav a{flex:1;max-width:50%;display:grid;gap:2px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);text-decoration:none;color:var(--text);transition:border-color .2s,transform .2s var(--ease)}
.lesson-nav a:hover{border-color:var(--accent);transform:translateY(-2px)}
.lesson-nav a.next{text-align:right;margin-left:auto}
.lesson-nav small{font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.lesson-nav span{font-weight:700}

/* ================= Завдання ================= */
.task{padding:clamp(18px,3vw,30px)}
.task-head{display:grid;gap:8px;margin-bottom:18px}
.task-intro{font-size:16.5px;color:var(--text-2);margin:0}
.task-body{display:grid;gap:18px}
.task-feedback:empty{display:none}
.task-feedback{margin-top:18px}
.task-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}
.task-actions .grow{flex:1}
.fb{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 16px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface-2);font-size:15.5px;line-height:1.55;animation:viewIn .3s var(--ease) both}
.fb>.ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok-border)}.fb.ok>.ico{background:var(--ok);color:#fff}
.fb.bad{background:var(--bad-soft);border-color:var(--bad-border)}.fb.bad>.ico{background:var(--bad);color:#fff}
.fb.info{background:var(--accent-soft);border-color:transparent}.fb.info>.ico{background:var(--accent);color:#fff}
.fb.warn{background:var(--warn-soft);border-color:var(--warn-border)}.fb.warn>.ico{background:var(--warn);color:#fff}
.fb ul{margin:.4em 0 0;padding-left:1.15em}
.fb li{margin:.25em 0}
.fb p{margin:0 0 .3em}
.hint{animation:viewIn .3s var(--ease) both}
.progress-line{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;color:var(--text-2)}
.progress-line .bar{flex:1;max-width:260px}
.pill-btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);font:700 15px/1.3 var(--font-ui);text-align:left;cursor:pointer;transition:border-color .18s,background-color .18s,color .18s,transform .15s var(--ease),box-shadow .18s;-webkit-tap-highlight-color:transparent}
.pill-btn:hover:not([disabled]){border-color:var(--accent);transform:translateY(-1px)}
.pill-btn[aria-pressed="true"],.pill-btn.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);box-shadow:0 0 0 1px var(--accent) inset}
.pill-btn.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);box-shadow:none}
.pill-btn.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);box-shadow:none}
.pill-btn.missed{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.pill-btn[disabled]{cursor:default}
.pill-btn .ico{opacity:.9}
.pill-btn.kind-actor{--k:var(--c-actor)}.pill-btn.kind-uc{--k:var(--c-uc)}
.pill-btn.kind-actor::before,.pill-btn.kind-uc::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--k)}
.pill-btn.kind-uc::before{width:13px;height:8px}
/* сортування */
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;padding:14px;border-radius:var(--r);border:1.5px dashed var(--border-strong);background:var(--surface-2);transition:border-color .2s,background-color .2s}
.pool.empty::before{content:attr(data-empty);color:var(--text-3);font-weight:600;font-size:14px;align-self:center}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.bucket{display:flex;flex-direction:column;gap:10px;min-height:150px;padding:14px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--surface);transition:border-color .2s,background-color .2s,box-shadow .2s;cursor:pointer;text-align:left;font:inherit;color:inherit}
.bucket-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.bucket-head small{margin-left:auto;font-weight:700;color:var(--text-3)}
.bucket-items{display:flex;flex-wrap:wrap;gap:8px}
.bucket.armed{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.bucket.drag-over,.pool.drag-over{border-color:var(--accent);background:var(--accent-soft)}
.bucket .tone{width:10px;height:10px;border-radius:50%}
.why-list{display:grid;gap:8px;margin:6px 0 0;padding:0;list-style:none}
.why-list li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14.5px;line-height:1.5}
.why-list .ico{margin-top:2px}
.why-list .ok-i{color:var(--ok)}.why-list .bad-i{color:var(--bad)}
/* текст зі словами */
.scenario{padding:18px 20px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--border);font-size:17px;line-height:2.05}
.word{display:inline;padding:.12em .42em;margin:0 .05em;border-radius:8px;border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--border-strong));background:var(--surface);color:var(--text);font:700 inherit/1.2 var(--font-ui);font-size:inherit;cursor:pointer;transition:background-color .18s,border-color .18s,color .18s}
.word:hover{border-color:var(--accent);background:var(--accent-soft)}
.word[aria-pressed="true"]{border-style:solid;border-color:var(--c-actor);background:var(--c-actor-soft);color:var(--c-actor)}
.word.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.word.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.word.missed{border-color:var(--warn);color:var(--warn)}
/* картки-рішення */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.fix-card,.choice-card,.pair-card{display:grid;gap:12px;padding:16px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--surface);transition:border-color .2s,box-shadow .2s}
.fix-card.ok,.choice-card.ok,.pair-card.ok{border-color:var(--ok-border);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 12%,transparent)}
.fix-card.bad,.pair-card.bad{border-color:var(--bad-border)}
.fix-card.flash{animation:cardFlash 1s ease}
@keyframes cardFlash{30%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 35%,transparent)}}
.fix-who{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.fix-who .ava{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--c-actor-soft);color:var(--c-actor)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt-why{font-size:14px;line-height:1.5;color:var(--text-2);margin:0}
.opt-why.ok{color:var(--ok)}.opt-why.bad{color:var(--bad)}
.choice-q{display:flex;gap:12px;align-items:flex-start;font-weight:700;font-size:16.5px;line-height:1.5}
.choice-q .n{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);font-weight:800;font-size:14px}
.choice-card.ok .choice-q .n{background:var(--ok);color:#fff}
.choice-opts{display:grid;gap:8px}
.choice-opt{display:grid;gap:3px}
.choice-opt .pill-btn{width:100%;justify-content:flex-start}
.choice-opt .opt-why{padding-left:6px}
.binary .choice-opts{grid-template-columns:1fr 1fr}
.pill-btn.inc{--c:var(--c-inc)}.pill-btn.ext{--c:var(--c-ext)}
.pill-btn.inc,.pill-btn.ext{justify-content:center!important;font-family:var(--font-mono);font-weight:600}
.pill-btn.inc:hover:not([disabled]),.pill-btn.ext:hover:not([disabled]){border-color:var(--c);color:var(--c)}
/* матриця */
.link-rows{display:grid;gap:12px}
.link-row{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:start;padding:14px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface)}
.link-row .who{display:flex;align-items:center;gap:10px;font-weight:800}
.link-row .who .ava{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--c-actor-soft);color:var(--c-actor);flex:none}
.link-row .who small{display:block;font-weight:700;color:var(--text-3);font-size:12px}
@media (max-width:640px){.link-row{grid-template-columns:1fr}}
/* сценарії (include) */
.scen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.scen{padding:14px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface)}
.scen h4{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:10px}
.scen ol{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:s}
.scen li{counter-increment:s}
.step-btn{display:flex;gap:8px;width:100%;padding:7px 10px;border-radius:10px;border:1.5px solid transparent;background:var(--surface-2);color:var(--text);font:600 14.5px/1.4 var(--font-ui);text-align:left;cursor:pointer;transition:background-color .18s,border-color .18s,color .18s}
.step-btn::before{content:counter(s) ".";color:var(--text-3);font-weight:800;min-width:18px}
.step-btn:hover{border-color:var(--border-strong)}
.step-btn[aria-pressed="true"]{background:var(--c-inc-soft);border-color:var(--c-inc-line);color:var(--c-inc)}
.step-btn.ok{background:var(--ok-soft);border-color:var(--ok-border);color:var(--ok)}
.step-btn.bad{background:var(--bad-soft);border-color:var(--bad-border);color:var(--bad)}
.sub-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;margin:4px 0 2px}
.sub-h .n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:13px}
/* ієрархія */
.hier-rows{display:grid;gap:10px}
.hier-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);font-weight:700}
.hier-row select{width:auto;min-width:200px;height:42px}
.hier-row.ok{border-color:var(--ok-border);background:var(--ok-soft)}
.hier-row.bad{border-color:var(--bad-border);background:var(--bad-soft)}
/* історія */
.story{padding:20px 22px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--border);font-size:17px;line-height:2.25}
.story select{display:inline-block;height:36px;padding:0 30px 0 10px;margin:0 2px;border-radius:9px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent-text);font:700 15px var(--font-ui);cursor:pointer;max-width:100%;vertical-align:baseline}
.story select.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.story select.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.sticky-diagram{position:sticky;top:calc(var(--topbar-h) + 8px);z-index:2}
/* конструктор */
.brief{padding:16px 18px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--border);font-size:16px;line-height:1.7}
.builder{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.palette{display:grid;gap:10px;align-content:start;padding:14px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface)}
.palette h4{display:flex;align-items:center;gap:8px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2)}
.palette .opts .pill-btn{font-size:14px;min-height:36px;padding:6px 11px}
.rel-form{display:grid;grid-template-columns:1fr 170px 1fr auto;gap:10px;align-items:end;padding:14px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface)}
.rel-form .input{height:44px;font-size:14.5px}
.rel-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.rel-list li{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:14.5px}
.rel-list li.ok{border-color:var(--ok-border);background:var(--ok-soft)}
.rel-list li.bad{border-color:var(--bad-border);background:var(--bad-soft)}
.rel-list .rel-type{font-family:var(--font-mono);font-size:12.5px;padding:2px 8px;border-radius:7px;background:var(--surface-3)}
.rel-list .rel-type.include{color:var(--c-inc);background:var(--c-inc-soft)}
.rel-list .rel-type.extend{color:var(--c-ext);background:var(--c-ext-soft)}
.rel-list .grow{flex:1}
@media (max-width:760px){.builder{grid-template-columns:1fr}.rel-form{grid-template-columns:1fr}}
.steps-track{display:flex;flex-wrap:wrap;gap:8px}
.steps-track .chip.current{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.prompt-box{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-text);font-weight:800;font-size:16.5px;line-height:1.45}
.prompt-box .ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:#fff}
.success{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;margin-top:20px;padding:20px 22px;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--ok-soft),color-mix(in srgb,var(--ok-soft) 40%,var(--surface)));border:1px solid var(--ok-border);animation:viewIn .45s var(--ease) both}
.success .big{grid-row:span 2;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--ok);color:#fff;box-shadow:0 12px 24px -12px var(--ok)}
.success h3{color:var(--ok);font-size:19px}
.success .row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}

/* ================= Вітання ================= */
.welcome{min-height:100dvh;display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,5vw,72px);align-items:center;max-width:1240px;margin:0 auto;padding:clamp(24px,5vw,64px) clamp(16px,4vw,48px)}
.welcome-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:clamp(24px,5vh,48px)}
.welcome h1{font-size:clamp(28px,3.5vw,46px);line-height:1.1;letter-spacing:-.03em}
.welcome h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome .lead{font-size:clamp(16.5px,1.6vw,19px);color:var(--text-2);margin:18px 0 22px;max-width:600px}
.feature-list{display:grid;gap:12px;margin:0 0 8px;padding:0;list-style:none}
.feature-list li{display:flex;gap:12px;align-items:center;font-weight:700}
.feature-list .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.feature-list li:nth-child(1) .ico{background:var(--c-actor-soft);color:var(--c-actor)}
.feature-list li:nth-child(2) .ico{background:var(--c-uc-soft);color:var(--c-uc)}
.feature-list li:nth-child(3) .ico{background:var(--c-ext-soft);color:var(--c-ext)}
.welcome-form{padding:clamp(22px,3.5vw,36px);position:relative}
.welcome-form::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none}
.welcome-form h2{margin-bottom:6px}
.welcome-form form{display:grid;gap:14px;margin-top:20px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--text-3);line-height:1.5}
@media (max-width:900px){.welcome{grid-template-columns:1fr;min-height:auto}}

/* ================= Головна ================= */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:clamp(22px,4vw,40px);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);pointer-events:none}
.hero h1{margin:8px 0 10px}
.hero .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 34px}
.stat{padding:16px 18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.stat small{display:block;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.stat b{display:block;margin-top:4px;font-family:var(--font-display);font-weight:600;font-size:22px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
.modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:34px}
.module-card{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.module-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.module-card .top{display:flex;align-items:center;gap:12px}
.module-card .badge{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;color:#fff;background:var(--grad);flex:none}
.module-card h3{font-size:17px}
.module-card p{margin:0;color:var(--text-2);font-size:14.5px;line-height:1.55}
.module-card ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.module-card li a,.module-card li span{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;color:var(--text);text-decoration:none;font-size:14.5px;font-weight:600}
.module-card li a:hover{background:var(--surface-3)}
.module-card li .st{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--border-strong);color:transparent}
.module-card li.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.module-card li.locked span{color:var(--text-3)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.feature-card{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:22px;text-decoration:none;color:var(--text)}
.feature-card .ico-big{grid-row:span 3;width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.feature-card p{margin:0;color:var(--text-2);font-size:14.5px}
.feature-card .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-3)}
.ring .val{transition:stroke-dashoffset 1.2s var(--ease)}
.ring-label{position:relative;display:grid;justify-items:center;line-height:1.1;text-align:center}
.ring-label b{font-family:var(--font-display);font-weight:600;font-size:var(--rs,30px)}
.ring-label span{font-size:12px;font-weight:700;color:var(--text-3);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero .ring{justify-self:start}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}

/* ================= Тест ================= */
.test-bar{position:sticky;top:calc(var(--topbar-h) + 10px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 12px 10px 18px;margin-bottom:18px;border-radius:var(--r-lg);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--border);box-shadow:var(--shadow)}
.test-bar .count{font-weight:800}
.timer{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);font:600 17px var(--font-mono);font-variant-numeric:tabular-nums}
.timer.warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-border)}
.timer.danger{color:var(--bad);background:var(--bad-soft);border-color:var(--bad-border);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 18%,transparent)}}
.qmap{display:flex;flex-wrap:wrap;gap:6px}
.qdot{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text-2);font:800 13px var(--font-ui);cursor:pointer;position:relative;transition:border-color .15s,background-color .15s}
.qdot:hover{border-color:var(--accent)}
.qdot.answered{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.qdot.current{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.qdot.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.question{padding:clamp(18px,3vw,30px)}
.question .q-text{font-size:clamp(17px,1.8vw,19.5px);font-weight:800;line-height:1.45;margin:10px 0 6px}
.question .q-hint{font-size:14px;color:var(--text-3);font-weight:700;margin-bottom:16px}
.answers{display:grid;gap:10px}
.answer{display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);font:600 16px/1.45 var(--font-ui);text-align:left;cursor:pointer;transition:border-color .15s,background-color .15s,transform .15s var(--ease)}
.answer:hover:not([disabled]){border-color:var(--accent);transform:translateY(-1px)}
.answer .mark{flex:none;width:22px;height:22px;margin-top:1px;border:2px solid var(--border-strong);border-radius:50%;display:grid;place-items:center;color:transparent;transition:background-color .15s,border-color .15s}
.answer.multi .mark{border-radius:7px}
.answer[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.answer[aria-checked="true"] .mark{background:var(--accent);border-color:var(--accent);color:#fff}
.answer.correct{border-color:var(--ok);background:var(--ok-soft)}
.answer.correct .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.answer.wrong{border-color:var(--bad);background:var(--bad-soft)}
.answer.wrong .mark{background:var(--bad);border-color:var(--bad);color:#fff}
.answer[disabled]{cursor:default}
.q-nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:22px}
.q-nav .grow{flex:1}
.hot-choice{font-weight:700;color:var(--text-2);font-size:15px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin:22px 0}
.rule{padding:16px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--border)}
.rule .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);margin-bottom:10px}
.rule b{display:block;font-family:var(--font-display);font-weight:600;font-size:20px}
.rule span{font-size:14px;color:var(--text-2);font-weight:600}
/* результати */
.result-hero{display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,4vw,40px);align-items:center;padding:clamp(22px,4vw,40px)}
.result-hero .verdict{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;font-weight:800}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}
.verdict.fail{background:var(--bad-soft);color:var(--bad)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin-top:18px}
.kv div{display:grid;gap:2px}
.kv small{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.kv b{font-size:16px}
.topic-bars{display:grid;gap:10px}
.topic-bar{display:grid;grid-template-columns:minmax(140px,220px) 1fr auto;gap:12px;align-items:center;font-size:14.5px;font-weight:700}
.topic-bar .bar{height:8px}
.review{display:grid;gap:12px}
.review-item{padding:18px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--surface);break-inside:avoid}
.review-item.ok{border-left:4px solid var(--ok)}
.review-item.bad{border-left:4px solid var(--bad)}
.review-item .head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.review-item .q{font-weight:800;font-size:16.5px;line-height:1.45;margin-bottom:12px}
.review-item .answers .answer{padding:10px 14px;font-size:15px}
.review-item .answer{pointer-events:none}
.review-item .explain{margin-top:12px;font-size:14.5px;color:var(--text-2);line-height:1.55}
.history{width:100%;border-collapse:collapse;font-size:15px}
.history th,.history td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--border)}
.history th{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.history tr.current td{background:var(--accent-soft)}
.print-only{display:none}

/* ================= Модальні вікна, тости ================= */
dialog.modal{width:min(560px,94vw);max-height:90vh;padding:0;border:1px solid var(--border);border-radius:var(--r-xl);background:var(--surface);color:var(--text);box-shadow:var(--shadow-lg);overflow:visible}
dialog.modal[open]{animation:modalIn .3s var(--ease) both}
dialog.modal::backdrop{background:rgba(10,8,25,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-inner{display:grid;gap:16px;padding:22px 24px 24px;max-height:90vh;overflow:auto;border-radius:inherit}
.modal-head{display:flex;align-items:center;gap:12px}
.modal-head h2{font-size:20px;margin-right:auto}
.modal-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px}
.settings-sec{display:grid;gap:12px;padding:16px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface-2)}
.settings-sec h3{font-size:15px}
.toast{position:fixed;left:50%;bottom:24px;z-index:120;display:flex;align-items:center;gap:10px;max-width:min(92vw,520px);padding:12px 16px;border-radius:14px;background:var(--text);color:var(--bg);font-weight:700;font-size:14.5px;box-shadow:var(--shadow-lg);transform:translate(-50%,20px);opacity:0;transition:transform .3s var(--ease),opacity .3s}
.toast.show{transform:translate(-50%,0);opacity:1}
.banner{display:flex;gap:12px;align-items:center;margin-bottom:18px;padding:12px 16px;border-radius:var(--r);background:var(--warn-soft);border:1px solid var(--warn-border);color:var(--text);font-weight:600;font-size:14.5px}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:130}
/* Шпаргалка: колонки залежать від реальної ширини розділу, картки однакової висоти,
   рамка діаграми заповнює вільне місце картки, а сама діаграма — по центру й не вища за 250px */
.cheat-sec{container-type:inline-size}
.cheat-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@container (min-width:560px){
  .cheat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cheat-grid>:last-child:nth-child(odd){grid-column:1/-1}
}
@container (min-width:880px){
  .cheat-grid.el{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cheat-grid.el>:last-child:nth-child(odd){grid-column:auto}
}
@container (min-width:1040px){
  .cheat-grid.rel{grid-template-columns:repeat(4,minmax(0,1fr))}
}
.cheat-card{padding:16px;display:flex;flex-direction:column;gap:8px}
.cheat-card h3{display:flex;align-items:center;gap:10px}
.cheat-card p{color:var(--text-2);font-size:15px;margin:0}
.cheat-card .diagram{flex:1;display:flex;flex-direction:column;margin:6px 0 0}
.cheat-card .diagram-canvas{flex:1;min-height:200px;padding:14px}
.cheat-card .diagram-canvas>svg{min-width:0!important;max-height:250px}

/* ================= Друк і доступність ================= */
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#fff}
  body::before,.topbar,.sidebar,.scrim,.no-print,.btn,.icon-btn,.toast{display:none!important}
  .shell{display:block}
  .main{padding:0}
  .card,.review-item{box-shadow:none!important}
  .print-only{display:block}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

<body>
<div id="app"></div>
<noscript><div style="max-width:560px;margin:15vh auto;padding:24px;font-family:system-ui;text-align:center">Для проходження курсу увімкніть JavaScript у браузері.</div></noscript>
<script type="module">
'use strict';
/* =====================================================================
   Налаштування
   ===================================================================== */
const CONFIG = {
  mermaidVersion: '12.2.0',
  storageKey: 'ucCourse.v1',
  themeKey: 'ucCourse.theme',
  test: { questions: 20, minutes: 20, passPercent: 75 },
};
const MERMAID_URL = `https://cdn.jsdelivr.net/npm/mermaid@${CONFIG.mermaidVersion}/dist/mermaid.esm.min.mjs`;
const FONT_STACK = '"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)');

/* =====================================================================
   Утиліти
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const escHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const debounce = (fn, ms) => { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; };
const fmtDateTime = ts => new Intl.DateTimeFormat('uk-UA', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(ts));
const fmtDuration = sec => { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m ? `${m} хв ${String(s).padStart(2, '0')} с` : `${s} с`; };
const fmtClock = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
function plural(n, one, few, many) {
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return one;
  if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return few;
  return many;
}
/* Мітка для Mermaid у лапках (лапки всередині — через код сутності) */
const ml = s => '"' + String(s).replace(/"/g, '#quot;') + '"';

/* =====================================================================
   Сховище (localStorage)
   ===================================================================== */
const Store = (() => {
  let available = true;
  try { const k = '__uc_probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); } catch { available = false; }
  const fresh = () => ({ version: 1, profile: null, lessons: {}, test: { current: null, attempts: [] } });
  const RANK = { new: 0, started: 1, done: 2 };
  let state = fresh();
  let lastJson = null;  // те, що зараз лежить у сховищі: однакові дані не перезаписуємо
  let quiet = 0;        // > 0 — під час оновлення з іншої вкладки нічого не пишемо
  let pending = false;  // запис уже заплановано на кінець поточної дії
  function migrate(d) {
    const s = Object.assign(fresh(), d && typeof d === 'object' ? d : {});
    if (!s.lessons || typeof s.lessons !== 'object') s.lessons = {};
    s.test = Object.assign({ current: null, attempts: [] }, s.test || {});
    if (!Array.isArray(s.test.attempts)) s.test.attempts = [];
    delete s.lastLesson;
    s.version = 1;
    return s;
  }
  /* Об’єднує стан зі сховища (inc) з поточним (mine) так, щоб прогрес ніколи не відкочувався:
     вищий статус уроку перемагає, за рівного — новіша чернетка; спроби тесту об’єднуються.
     За рівних даних лишаємо власні об’єкти: на них посилаються відкриті завдання й тест. */
  function merge(inc, mine) {
    if (!inc.profile && mine.profile) inc.profile = mine.profile;
    for (const [id, m] of Object.entries(mine.lessons)) {
      const i = inc.lessons[id];
      const ri = i ? (RANK[i.status] ?? 0) : -1, rm = RANK[m.status] ?? 0;
      if (rm > ri || (rm === ri && (m.updatedAt || 0) >= (i.updatedAt || 0))) inc.lessons[id] = m;
    }
    const submitted = new Set(inc.test.attempts.map(a => a.startedAt));
    for (const a of mine.test.attempts) if (!submitted.has(a.startedAt)) { inc.test.attempts.push(a); submitted.add(a.startedAt); }
    inc.test.attempts.sort((a, b) => a.submittedAt - b.submittedAt).forEach((a, k) => { a.n = k + 1; });
    inc.test.current = [mine.test.current, inc.test.current]
      .filter(c => c && !submitted.has(c.startedAt))
      .sort((a, b) => (b.startedAt - a.startedAt) || ((b.updatedAt || 0) - (a.updatedAt || 0)))[0] || null;
    return inc;
  }
  function load() {
    if (!available) return;
    try {
      const raw = localStorage.getItem(CONFIG.storageKey);
      lastJson = raw;
      state = raw ? migrate(JSON.parse(raw)) : fresh();
    } catch (e) { console.warn('Не вдалося прочитати збережений прогрес', e); state = fresh(); }
  }
  /* Підхопити зміни з інших вкладок, не втративши власного прогресу.
     changed — поточний стан змінився (треба перемалювати), heal — у сховищі бракує нашого прогресу. */
  function sync() {
    const none = { changed: false, heal: false };
    if (!available) return none;
    let raw;
    try { raw = localStorage.getItem(CONFIG.storageKey); } catch { return none; }
    if (raw === lastJson) return none;
    lastJson = raw;
    if (raw === null) { state = fresh(); return { changed: true, heal: false }; } // прогрес скинули в іншій вкладці
    let inc;
    try { inc = migrate(JSON.parse(raw)); } catch { return none; }
    const incJson = JSON.stringify(inc), before = JSON.stringify(state);
    state = merge(inc, state);
    const after = JSON.stringify(state);
    return { changed: after !== before, heal: after !== incJson };
  }
  function flush() {
    if (!pending) return;
    pending = false;
    try {
      const json = JSON.stringify(state);
      if (json === lastJson) return;
      localStorage.setItem(CONFIG.storageKey, json);
      lastJson = json;
    } catch (e) { console.warn('Не вдалося зберегти прогрес', e); }

/* =====================================================================
   Тема: системна / світла / темна
   ===================================================================== */
const Theme = (() => {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  let pref = 'system';
  try { pref = localStorage.getItem(CONFIG.themeKey) || 'system'; } catch {}
  if (!['system', 'light', 'dark'].includes(pref)) pref = 'system';
  const listeners = new Set();
  const resolve = () => (pref === 'dark' || (pref === 'system' && mq.matches)) ? 'dark' : 'light';
  let current = document.documentElement.dataset.theme || resolve();
  function apply() {
    const next = resolve();
    if (next === current) { listeners.forEach(fn => fn(current, false)); return; }
    const root = document.documentElement;
    root.classList.add('theme-switching');
    root.dataset.theme = next;
    root.style.colorScheme = next;
    $('meta[name="theme-color"]')?.setAttribute('content', next === 'dark' ? '#0b0c12' : '#f6f5fb');
    current = next;
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('theme-switching')));
    listeners.forEach(fn => fn(current, true));
  }
  mq.addEventListener('change', () => { if (pref === 'system') apply(); });
  return {
    get pref() { return pref; },
    get current() { return current; },
    set(p) { pref = p; try { localStorage.setItem(CONFIG.themeKey, p); } catch {} apply(); },
    sync() { try { pref = localStorage.getItem(CONFIG.themeKey) || 'system'; } catch {} apply(); },
    onChange(fn) { listeners.add(fn); },
  };
})();

/* =====================================================================

   ===================================================================== */
const Diagrams = (() => {
  let mermaid = null, loading = null, configuredFor = null, seq = 0;
  let queue = Promise.resolve();
  const mounted = new Set();
  const themeName = t => t === 'dark' ? 'redux-dark-color' : 'redux-color';

  async function fontsReady() {
    try {
      await Promise.race([
        Promise.all([document.fonts.load('500 14px Manrope'), document.fonts.load('700 14px Manrope')]).then(() => document.fonts.ready),
        new Promise(r => setTimeout(r, 2500)),
      ]);
    } catch {}
  }
  function load() {
    if (!loading) {
      loading = (async () => {
        await fontsReady();
        const mod = await import(MERMAID_URL);
        mermaid = mod.default;
        return mermaid;
      })().catch(err => { loading = null; throw err; });
    }
    return loading;
  }

    mermaid.initialize({

    const token = (canvas._ucToken || 0) + 1;

    canvas._ucSrc = src;
    mounted.add(canvas);
    canvas.classList.add('is-rendering');
    try {
      await load();
      const { svg, bindFunctions } = await enqueue(async () => {
        if (configuredFor !== Theme.current) configure();
        return mermaid.render('ucd' + (++seq), src);
      });
      if (token !== canvas._ucToken) return;
      canvas.innerHTML = svg;
      const svgEl = canvas.querySelector('svg');
      bindFunctions?.(canvas);
      canvas._ucTheme = Theme.current;
      canvas._ucOnRender?.(svgEl);
    } catch (err) {
      if (token !== canvas._ucToken) return;
      canvas._ucTheme = null;
      showError(canvas, err);
    } finally {
      if (token === canvas._ucToken) canvas.classList.remove('is-rendering');

    console.warn('Mermaid:', err);
    const box = h('div', { class: 'diagram-error', role: 'alert' },
      h('b', {}, offline ? 'Не вдалося завантажити Mermaid' : 'Не вдалося намалювати діаграму'),
      h('span', {}, offline ? 'Перевір підключення до інтернету — діаграми малюються бібліотекою Mermaid 12 з CDN.' : String(err?.message || err).slice(0, 300)),
      h('details', {}, h('summary', {}, 'Код діаграми'), h('pre', { class: 'code', html: highlightMermaid(canvas._ucSrc || '') })),
      h('button', { class: 'btn btn-secondary btn-sm', type: 'button', onclick: () => render(canvas, canvas._ucSrc) }, icon('refresh', 16), 'Спробувати ще раз'));
    canvas.replaceChildren(box);
  }
  function rerenderAll() {
    for (const c of [...mounted]) {

    }

    load, render, rerenderAll,
    async parse(src) { await load(); return mermaid.parse(src); },
    get ready() { return !!mermaid; },
  };
})();

/* Підсвічування синтаксису Mermaid у панелі коду */
function highlightMermaid(src) {
  return String(src).split('\n').map(line => {
    if (/^\s*%%/.test(line)) return `<span class="hl-c">${escHtml(line)}</span>`;
    let l = escHtml(line);
    l = l.replace(/(&quot;.*?&quot;)/g, '<span class="hl-s">$1</span>');
    l = l.replace(/^(\s*)(usecase-beta|direction|actor|systemBoundary|end|note for|accTitle|accDescr)(?=\s|$)/, '$1<span class="hl-k">$2</span>');
    l = l.replace(/(--\|&gt;|\.\.&gt;|--&gt;|(?<![\w-])--(?![\w-]))/g, '<span class="hl-o">$1</span>');

    target.addEventListener('click', fire);

function openModal({ title, body, actions, onClose, cls }) {
  const dlg = h('dialog', { class: 'modal' + (cls ? ' ' + cls : ''), 'aria-label': title });
  /* Закриваємо синхронно, не чекаючи асинхронної події close */
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    if (dlg.open) dlg.close();
    dlg.remove();
    onClose?.();
  };
  const inner = h('div', { class: 'modal-inner' },
    h('div', { class: 'modal-head' }, h('h2', {}, title), h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Закрити', onclick: close }, icon('x'))),
    h('div', { class: 'modal-body' }, body),
    actions ? h('div', { class: 'modal-actions' }, actions(close)) : null);
  dlg.append(inner);
  dlg.addEventListener('click', e => { if (e.target === dlg) close(); });
  dlg.addEventListener('cancel', e => { e.preventDefault(); close(); });

  const val = wrap.querySelector('.val');
  requestAnimationFrame(() => requestAnimationFrame(() => { val.style.strokeDashoffset = String(c * (1 - Math.max(0, Math.min(100, percent)) / 100)); }));
