function Bar(percent) { return h('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(percent) }, h('i', { style: { width: percent + '%' } })); }

/* Конфеті для святкувань */
function confetti(count = 140) {
  if (REDUCED_MOTION.matches) return;
  const cv = h('canvas', { class: 'confetti', 'aria-hidden': 'true' });
  document.body.append(cv);
  const ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  const colors = ['#7c5cff', '#2dd4bf', '#e879f9', '#38bdf8', '#fb923c', '#facc15'];
  const parts = Array.from({ length: count }, () => ({
    x: W / 2 + (Math.random() - .5) * W * .25, y: H * .42,
    vx: (Math.random() - .5) * 15 * dpr, vy: (-Math.random() * 13 - 6) * dpr,
    s: (5 + Math.random() * 6) * dpr, c: colors[Math.random() * colors.length | 0],
    rot: Math.random() * 6.28, vr: (Math.random() - .5) * .35, rect: Math.random() < .6,
  }));
  const start = performance.now(); let last = start;
  (function frame(t) {
    const dt = Math.min(2.5, (t - last) / 16.7); last = t;
    ctx.clearRect(0, 0, W, H);
    let alive = false;
    for (const p of parts) {
      p.vy += .32 * dpr * dt; p.vx *= .992; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.y < H + 30) alive = true;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      if (p.rect) ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); else { ctx.beginPath(); ctx.arc(0, 0, p.s / 2.6, 0, 6.283); ctx.fill(); }
      ctx.restore();
    }
    if (alive && t - start < 4200) requestAnimationFrame(frame); else cv.remove();
  })(start);
}
/* =====================================================================
   Механіки завдань. Кожна: (cfg, ctx) => { el, check? }
   ctx: draft (зберігається), save(), feedback(html|Node, tone), solved(), done
   ===================================================================== */
const TASKS = {};
const KIND_UA = { actor: 'актор', usecase: 'варіант використання', boundary: 'межа системи', relationship: 'відношення (лінія)' };
const kindMsg = hit => `Це ${KIND_UA[hit.kind] || 'інший елемент'}. Спробуй ще раз.`;
const item = (text, why) => `<b>${escHtml(text)}</b> — ${why}`;

/* Сортування карток по кошиках (+ опційна жива діаграма) */
TASKS.sort = (cfg, ctx) => {
  const d = ctx.draft; d.place ||= {};
  let selected = null, checked = !!ctx.done;
  const pool = h('div', { class: 'pool', 'data-empty': 'Усі картки розкладено' });
  const bucketsEl = h('div', { class: 'buckets' });
  const frame = cfg.diagram ? DiagramFrame(cfg.diagram(d.place), { title: cfg.diagramTitle || 'Жива діаграма', caption: cfg.diagramCaption }) : null;
  const upd = debounce(() => frame?.update(cfg.diagram(d.place)), 120);

  function chip(it) {
    const at = d.place[it.id];
    const st = checked && at ? (at === it.bucket ? ' ok' : ' bad') : '';
    const b = h('button', { class: 'pill-btn' + st, type: 'button', draggable: 'true', 'aria-pressed': String(selected === it.id) }, it.text);
    b.addEventListener('click', e => { e.stopPropagation(); selected = selected === it.id ? null : it.id; draw(); });
    b.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', it.id); e.dataTransfer.effectAllowed = 'move'; });
    return b;
  }
  function moveTo(id, bucketId) {
    if (!id) return;
    if (bucketId) d.place[id] = bucketId; else delete d.place[id];
    selected = null; checked = false; ctx.feedback(null); ctx.save(); draw(); upd();
  }
  function dropZone(node, bucketId) {
    node.addEventListener('dragover', e => { e.preventDefault(); node.classList.add('drag-over'); });
    node.addEventListener('dragleave', () => node.classList.remove('drag-over'));
    node.addEventListener('drop', e => { e.preventDefault(); node.classList.remove('drag-over'); moveTo(e.dataTransfer.getData('text/plain'), bucketId); });
  }
  dropZone(pool, null);
  pool.addEventListener('click', () => { if (selected && d.place[selected]) moveTo(selected, null); });
  function draw() {
    const unplaced = cfg.items.filter(i => !d.place[i.id]);
    pool.replaceChildren(...unplaced.map(chip));
    pool.classList.toggle('empty', !unplaced.length);
    bucketsEl.replaceChildren(...cfg.buckets.map(bk => {
      const items = cfg.items.filter(i => d.place[i.id] === bk.id);
      const node = h('div', { class: 'bucket' + (selected ? ' armed' : ''), role: 'button', tabindex: '0', 'aria-label': `Покласти в «${bk.title}»` },
        h('div', { class: 'bucket-head' }, bk.tone ? h('span', { class: 'tone', style: { background: bk.tone } }) : null, bk.title, h('small', {}, String(items.length))),
        bk.hint ? h('div', { class: 'subtle', style: { fontSize: '13.5px', marginTop: '-6px' } }, bk.hint) : null,
        h('div', { class: 'bucket-items' }, items.map(chip)));
      node.addEventListener('click', () => moveTo(selected, bk.id));
      node.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === node) { e.preventDefault(); moveTo(selected, bk.id); } });
      dropZone(node, bk.id);
      return node;
    }));
  }
  draw();
  return {
    el: h('div', { class: 'task-body' },
      h('p', { class: 'subtle', style: { margin: 0, fontWeight: 600, fontSize: '14px' } }, 'Клацни картку, а потім кошик — або просто перетягни її. Щоб повернути картку назад, обери її й клацни на порожнє поле зверху.'),
      pool, bucketsEl, frame),
    check() {
      const left = cfg.items.filter(i => !d.place[i.id]).length;
      if (left) return { ok: false, tone: 'warn', message: `Спершу розклади всі картки — лишилося ${left}.` };
      checked = true; draw();
      const wrong = cfg.items.filter(i => d.place[i.id] !== i.bucket);
      if (!wrong.length) return { ok: true, message: h('div', {}, h('p', {}, h('b', {}, 'Усе розкладено правильно!'), ' Коротко чому:'), whyList(cfg.items.map(i => ({ ok: true, html: item(i.text, i.why) })))) };
      return { ok: false, message: h('div', {}, h('p', {}, `Правильно ${cfg.items.length - wrong.length} з ${cfg.items.length}. Переклади картки з червоною рамкою:`), whyList(wrong.map(i => ({ ok: false, html: item(i.text, i.why) })))) };
    },
  };
};

/* Гарячі точки: послідовні кроки («знайди…») або пошук помилок */
TASKS.hotspot = (cfg, ctx) => {
  const d = ctx.draft, find = cfg.mode === 'find';
  if (find) d.found ||= []; else { d.step ??= 0; d.hits ||= []; }
  const track = h('div', { class: 'steps-track' });
  const promptBox = h('div', { class: 'prompt-box', 'aria-live': 'polite' });
  let svgRef = null;
  const frame = DiagramFrame(cfg.diagram, {
    title: cfg.diagramTitle || 'Клацай по елементах діаграми',
    onRender: svg => { svgRef = svg; enableHotspots(svg, onHit); paint(); },
  });
  function paint() {
    if (!svgRef) return;
    if (find) d.found.forEach(i => markEls(svgRef, cfg.targets[i].ids, 'uc-ok'));
    else markEls(svgRef, d.hits, 'uc-ok');
  }
  function drawHead() {
    if (find) {
      track.replaceChildren(...cfg.targets.map((t, i) => {
        const f = d.found.includes(i);
        return h('span', { class: 'chip' + (f ? ' ok' : '') }, f ? icon('check', 14) : null, f ? t.title : `Помилка ${i + 1}`);
      }));
      const all = d.found.length >= cfg.targets.length;
      promptBox.replaceChildren(icon(all ? 'check' : 'target', 18), h('span', {}, all ? 'Усі помилки знайдено!' : `Знайдено ${d.found.length} з ${cfg.targets.length}. ${cfg.prompt || ''}`));
    } else {
      track.replaceChildren(...cfg.steps.map((s, i) => h('span', { class: 'chip' + (i < d.step ? ' ok' : i === d.step ? ' current' : '') }, i < d.step ? icon('check', 14) : null, `Крок ${i + 1}`)));
      const all = d.step >= cfg.steps.length;
      promptBox.replaceChildren(icon(all ? 'check' : 'pointer', 18), h('span', {}, all ? 'Усі елементи знайдено!' : cfg.steps[d.step].prompt));
    }
  }
  function onHit(hit) {
    if (find) {
      const ti = cfg.targets.findIndex(t => t.ids.includes(hit.id));
      if (ti < 0) { flashEl(svgRef, hit.id); ctx.feedback((cfg.fine && cfg.fine(hit)) || 'Тут усе гаразд — шукай далі.', 'info'); return; }
      if (d.found.includes(ti)) { ctx.feedback(`Цю помилку вже знайдено: «${cfg.targets[ti].title}».`, 'info'); return; }
      d.found.push(ti); ctx.save(); paint(); drawHead();
      ctx.feedback(`<b>${cfg.targets[ti].title}.</b> ${cfg.targets[ti].why}`, 'ok');
      if (d.found.length === cfg.targets.length) ctx.solved();
    } else {
      if (d.step >= cfg.steps.length) return;
      const step = cfg.steps[d.step];
      if (step.accept(hit)) {
        d.step++; d.hits.push(hit.id); ctx.save(); paint(); flashEl(svgRef, hit.id); drawHead();
        ctx.feedback(step.ok, 'ok');
        if (d.step >= cfg.steps.length) ctx.solved();
      } else {
        flashEl(svgRef, hit.id, 'uc-bad');
        ctx.feedback((step.wrong && step.wrong(hit)) || kindMsg(hit), 'bad');
      }
    }
  }
  drawHead();
  return { el: h('div', { class: 'task-body' }, track, promptBox, frame) };
};

/* Вибір слів у тексті — обрані ролі стають акторами на діаграмі */
TASKS.words = (cfg, ctx) => {
  const d = ctx.draft; d.sel ||= [];
  let checked = !!ctx.done;
  const scen = h('div', { class: 'scenario' });
  const frame = DiagramFrame(cfg.diagram(d.sel), { title: 'Жива діаграма', caption: cfg.diagramCaption });
  const upd = debounce(() => frame.update(cfg.diagram(d.sel)), 120);
  function draw() {
    const parts = cfg.text.split(/\{(\w+)\}/);
    scen.replaceChildren(...parts.map((p, i) => {
      if (i % 2 === 0) return p;
      const t = cfg.tokens[p], on = d.sel.includes(p);
      let cls = 'word';
      if (checked && on) cls += t.actor ? ' ok' : ' bad';
      return h('button', { class: cls, type: 'button', 'aria-pressed': String(on), onclick: () => {
        d.sel = on ? d.sel.filter(k => k !== p) : [...d.sel, p];
        checked = false; ctx.feedback(null); ctx.save(); draw(); upd();
      } }, t.text);
    }));
  }
  draw();
  return {
    el: h('div', { class: 'task-body' }, scen, frame),
    check() {
      const keys = Object.keys(cfg.tokens);
      const actors = keys.filter(k => cfg.tokens[k].actor);
      const wrong = keys.filter(k => d.sel.includes(k) && !cfg.tokens[k].actor);
      const found = actors.filter(k => d.sel.includes(k));
      checked = true; draw();
      if (!wrong.length && found.length === actors.length) {
        return { ok: true, message: h('div', {}, h('p', {}, h('b', {}, `Усі ${actors.length} актори знайдені!`)),
          whyList(actors.map(k => ({ ok: true, html: item(cfg.tokens[k].text, cfg.tokens[k].why) }))),
          h('p', { style: { margin: '12px 0 4px', fontWeight: 800 } }, 'А ці слова — не актори:'),
          whyList(keys.filter(k => !cfg.tokens[k].actor).map(k => ({ ok: false, html: item(cfg.tokens[k].text, cfg.tokens[k].why) })))) };
      }
      const box = h('div', {}, h('p', {}, `Знайдено акторів: ${found.length} з ${actors.length}.`));
      if (wrong.length) box.append(h('p', {}, 'Ці слова не є акторами:'), whyList(wrong.map(k => ({ ok: false, html: item(cfg.tokens[k].text, cfg.tokens[k].why) }))));
      if (found.length < actors.length) box.append(h('p', { style: { marginTop: '8px' } }, 'Шукай далі: актором може бути не лише людина, а й зовнішня система чи навіть час.'));
      return { ok: false, message: box };
    },
  };
};

/* Виправлення акторів: залишити / видалити / замінити */
TASKS.fix = (cfg, ctx) => {
  const d = ctx.draft; d.choice ||= {};
  let checked = !!ctx.done;
  const cards = h('div', { class: 'grid-cards' });
  const frame = DiagramFrame(cfg.diagram(d.choice), {
    title: cfg.diagramTitle || 'Діаграма для виправлення',
    caption: 'Порада: клацни на актора на діаграмі — відкриється його картка.',
    onRender: svg => enableHotspots(svg, hit => {
      const card = cards.querySelector(`[data-actor="${CSS.escape(hit.id)}"]`);
      if (!card) return;
      card.scrollIntoView({ block: 'nearest', behavior: REDUCED_MOTION.matches ? 'auto' : 'smooth' });
      card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
      card.querySelector('button')?.focus({ preventScroll: true });
    }, ['actor']),
  });
  const upd = debounce(() => frame.update(cfg.diagram(d.choice)), 100);
  function draw() {
    cards.replaceChildren(...cfg.actors.map(a => {
      const ch = d.choice[a.id], opt = a.options.find(o => o.id === ch);
      return h('div', { class: 'fix-card' + (checked && opt ? (opt.ok ? ' ok' : ' bad') : ''), dataset: { actor: a.id } },
        h('div', { class: 'fix-who' }, h('span', { class: 'ava' }, icon('actor', 18)), a.label),
        h('div', { class: 'opts' }, a.options.map(o => h('button', {
          class: 'pill-btn' + (checked && ch === o.id ? (o.ok ? ' ok' : ' bad') : ''), type: 'button', 'aria-pressed': String(ch === o.id),
          onclick: () => { d.choice[a.id] = o.id; checked = false; ctx.feedback(null); ctx.save(); draw(); upd(); },
        }, o.text))),
        checked && opt ? h('p', { class: 'opt-why ' + (opt.ok ? 'ok' : 'bad') }, opt.why) : null);
    }));
  }
  draw();
  return {
    el: h('div', { class: 'task-body' }, frame, cards),
    check() {
      const left = cfg.actors.filter(a => !d.choice[a.id]).length;
      if (left) return { ok: false, tone: 'warn', message: `Обери дію для кожного актора — лишилося ${left}.` };
      checked = true; draw();
      const wrong = cfg.actors.filter(a => !a.options.find(o => o.id === d.choice[a.id])?.ok).length;
      if (!wrong) return { ok: true, message: '<b>Діаграму виправлено!</b> Тепер на ній лише справжні ролі, а внутрішні частини системи та пристрої зникли.' };
      return { ok: false, message: `Правильних рішень: ${cfg.actors.length - wrong} з ${cfg.actors.length}. Прочитай пояснення під картками з червоною рамкою.` };
    },
  };
};
/* Картки з вибором найкращого варіанта (кожна — з поясненнями і міні-діаграмою) */
TASKS.choice = (cfg, ctx) => {
  const d = ctx.draft; d.tried ||= {}; d.solved ||= [];
  const list = h('div', { class: 'grid-cards', style: { gridTemplateColumns: '1fr' } });
  const progress = h('div', { class: 'progress-line' });
  const nodes = {};
  function card(c, idx) {
    const solved = d.solved.includes(c.id), tried = d.tried[c.id] || [];
    const node = h('div', { class: 'choice-card' + (solved ? ' ok' : '') + (cfg.binary ? ' binary' : '') },
      h('div', { class: 'choice-q' }, h('span', { class: 'n' }, solved ? icon('check', 16) : String(idx + 1)), h('span', { html: c.prompt })));
    const opts = h('div', { class: 'choice-opts' });
    for (const o of c.options) {
      const wasTried = tried.includes(o.id);
      const st = solved && o.ok ? ' ok' : wasTried && !o.ok ? ' bad' : '';
      opts.append(h('div', { class: 'choice-opt' },
        h('button', { class: 'pill-btn ' + (o.cls || '') + st, type: 'button', disabled: solved || (wasTried && !o.ok) ? true : null, onclick: () => pick(c, o) }, o.text),
        (solved || wasTried) && o.why ? h('p', { class: 'opt-why ' + (o.ok ? 'ok' : 'bad') }, o.why) : null));
    }
    node.append(opts);
    if (solved && c.diagram) node.append(DiagramFrame(typeof c.diagram === 'function' ? c.diagram() : c.diagram, { compact: true, tools: false, caption: c.caption }));
    return node;
  }
  function drawProgress() { progress.replaceChildren(h('span', {}, `Розв’язано ${d.solved.length} з ${cfg.cards.length}`), Bar(Math.round(100 * d.solved.length / cfg.cards.length))); }
  function pick(c, o) {
    d.tried[c.id] = [...new Set([...(d.tried[c.id] || []), o.id])];
    if (o.ok && !d.solved.includes(c.id)) d.solved.push(c.id);
    ctx.save();
    const n = card(c, cfg.cards.indexOf(c));
    nodes[c.id].replaceWith(n); nodes[c.id] = n;
    drawProgress();
    if (d.solved.length === cfg.cards.length) ctx.solved();
  }
  cfg.cards.forEach((c, i) => { nodes[c.id] = card(c, i); list.append(nodes[c.id]); });
  drawProgress();
  return { el: h('div', { class: 'task-body' }, progress, list) };
};

/* Матриця зв’язків «актор × варіант використання» */
TASKS.matrix = (cfg, ctx) => {
  const d = ctx.draft; d.on ||= [];
  let checked = !!ctx.done;
  const rows = h('div', { class: 'link-rows' });
  const frame = DiagramFrame(cfg.diagram(d.on), { title: 'Жива діаграма' });
  const upd = debounce(() => frame.update(cfg.diagram(d.on)), 120);
  const ok = k => cfg.required.includes(k) || (cfg.allowed || []).includes(k);
  const label = k => { const [a, u] = k.split(':'); return `${cfg.actors.find(x => x.id === a).label} — ${cfg.ucs.find(x => x.id === u).label}`; };
  function draw() {
    rows.replaceChildren(...cfg.actors.map(a => h('div', { class: 'link-row' },
      h('div', { class: 'who' }, h('span', { class: 'ava' }, icon('actor', 17)), h('div', {}, a.label, a.sub ? h('small', {}, a.sub) : null)),
      h('div', { class: 'opts' }, cfg.ucs.map(u => {
        const key = a.id + ':' + u.id, on = d.on.includes(key);
        return h('button', {
          class: 'pill-btn kind-uc' + (checked && on ? (ok(key) ? ' ok' : ' bad') : ''), type: 'button', 'aria-pressed': String(on),
          onclick: () => { d.on = on ? d.on.filter(k => k !== key) : [...d.on, key]; checked = false; ctx.feedback(null); ctx.save(); draw(); upd(); },
        }, u.label);
      })))));
  }
  draw();
  return {
    el: h('div', { class: 'task-body' }, rows, frame),
    check() {
      checked = true; draw();
      const missing = cfg.required.filter(k => !d.on.includes(k));
      const wrong = d.on.filter(k => !ok(k));
      if (!missing.length && !wrong.length) return { ok: true, message: cfg.success || '<b>Усі зв’язки на місці!</b>' };
      const box = h('div');
      if (wrong.length) box.append(h('p', {}, 'Зайві зв’язки (червоні):'), whyList(wrong.map(k => ({ ok: false, html: `<b>${escHtml(label(k))}</b> — ${cfg.why?.[k] || 'за описом цей актор не бере участі в цьому варіанті використання.'}` }))));
      if (missing.length) box.append(h('p', { style: { marginTop: wrong.length ? '10px' : 0 } }, `Бракує ${missing.length} ${plural(missing.length, 'зв’язку', 'зв’язків', 'зв’язків')}. Перечитай опис: хто бере участь у кожному варіанті використання?`));
      return { ok: false, message: box };
    },
  };
};

/* «Знайди спільне»: позначити повторювані кроки і назвати включений варіант використання */
TASKS.extract = (cfg, ctx) => {
  const d = ctx.draft; d.sel ||= [];
  let checked = !!ctx.done;
  const grid = h('div', { class: 'scen-grid' });
  const names = h('div', { class: 'opts' });
  const frame = DiagramFrame(cfg.diagram(d), { title: 'Жива діаграма' });
  const upd = debounce(() => frame.update(cfg.diagram(d)), 120);
  const touch = () => { checked = false; ctx.feedback(null); ctx.save(); draw(); upd(); };
  function draw() {
    grid.replaceChildren(...cfg.scenarios.map(s => h('div', { class: 'scen' },
      h('h4', {}, h('span', { class: 't-uc' }, s.title)),
      h('ol', {}, s.steps.map(k => {
        const on = d.sel.includes(k);
        return h('li', {}, h('button', {
          class: 'step-btn' + (checked && on ? (cfg.common.includes(k) ? ' ok' : ' bad') : ''), type: 'button', 'aria-pressed': String(on),
          onclick: () => { d.sel = on ? d.sel.filter(x => x !== k) : [...d.sel, k]; touch(); },
        }, cfg.steps[k]));
      })))));
    names.replaceChildren(...cfg.names.map(n => h('button', {
      class: 'pill-btn kind-uc' + (checked && d.name === n.id ? (n.ok ? ' ok' : ' bad') : ''), type: 'button', 'aria-pressed': String(d.name === n.id),
      onclick: () => { d.name = n.id; touch(); },
    }, n.text)));
  }
  draw();
  return {
    el: h('div', { class: 'task-body' },
      h('div', { class: 'sub-h' }, h('span', { class: 'n' }, '1'), 'Познач кроки, які повторюються в усіх трьох сценаріях'),
      grid,
      h('div', { class: 'sub-h' }, h('span', { class: 'n' }, '2'), 'Як назвати новий варіант використання для цих кроків?'),
      names, frame),
    check() {
      checked = true; draw();
      const problems = [];
      const extra = d.sel.filter(k => !cfg.common.includes(k));
      const missing = cfg.common.filter(k => !d.sel.includes(k));
      if (extra.length) problems.push({ ok: false, html: `Зайві кроки: ${extra.map(k => '«' + escHtml(cfg.steps[k]) + '»').join(', ')} — їх немає в усіх сценаріях, тож вони лишаються у своєму варіанті використання.` });
      if (missing.length) problems.push({ ok: false, html: `Позначено не всі спільні кроки — бракує ${missing.length}.` });
      const nm = cfg.names.find(n => n.id === d.name);
      if (!nm) problems.push({ ok: false, html: 'Обери назву для нового варіанта використання.' });
      else if (!nm.ok) problems.push({ ok: false, html: `Назва «${escHtml(nm.text)}»: ${nm.why}` });
      if (!problems.length) return { ok: true, message: cfg.success(nm) };
      return { ok: false, message: whyList(problems) };
    },
  };
};

/* Напрямок extend: обрати базовий варіант використання в кожній парі */
TASKS.direction = (cfg, ctx) => {
  const d = ctx.draft; d.base ||= {};
  const list = h('div', { class: 'grid-cards', style: { gridTemplateColumns: '1fr' } });
  const nodes = {};
  const src = (p, k) => {
    const base = p[k], ext = p[k === 'a' ? 'b' : 'a'];
    return ['usecase-beta', 'direction LR', `actor Act(${ml(p.actor)})`, `${base.id}(${ml(base.label)})`, `${ext.id}(${ml(ext.label)})`,
      `Act -- ${base.id}`, `${ext.id} ..> : extend ${base.id}`, `note for ${ext.id} ${ml('Умова: ' + p.cond)}`].join('\n');
  };
  function card(p, i) {
    const ch = d.base[p.id], ok = ch === p.base;
    const node = h('div', { class: 'pair-card' + (ch ? (ok ? ' ok' : ' bad') : '') },
      h('div', { class: 'choice-q' }, h('span', { class: 'n' }, ok ? icon('check', 16) : String(i + 1)), h('span', { html: p.prompt })),
      h('div', { class: 'opts' }, ['a', 'b'].map(k => h('button', {
        class: 'pill-btn kind-uc' + (ch === k ? (ok ? ' ok' : ' bad') : ''), type: 'button', 'aria-pressed': String(ch === k), disabled: ok ? true : null,
        onclick: () => choose(p, k),
      }, p[k].label))));
    if (ch) node.append(h('p', { class: 'opt-why ' + (ok ? 'ok' : 'bad') }, ok ? p.okWhy : p.badWhy), DiagramFrame(src(p, ch), { compact: true, tools: false }));
    return node;
  }
  function choose(p, k) {
    d.base[p.id] = k; ctx.save();
    const n = card(p, cfg.pairs.indexOf(p));
    nodes[p.id].replaceWith(n); nodes[p.id] = n;
    if (cfg.pairs.every(x => d.base[x.id] === x.base)) ctx.solved();
  }
  cfg.pairs.forEach((p, i) => { nodes[p.id] = card(p, i); list.append(nodes[p.id]); });
  return { el: h('div', { class: 'task-body' }, list) };
};

/* Ієрархія акторів (узагальнення) + підсвітка успадкованих можливостей */
TASKS.hierarchy = (cfg, ctx) => {
  const d = ctx.draft; d.parent ||= {}; d.pick ||= [];
  let checked = !!ctx.done, svgRef = null;
  const label = id => cfg.actors.find(a => a.id === id)?.label || '';
  const chain = (id, H) => { const out = []; let cur = id; while (cur && !out.includes(cur)) { out.push(cur); cur = H[cur]; } return out; };
  const abilities = (id, H) => { const anc = chain(id, H); return cfg.ucs.filter(u => anc.includes(u.owner)).map(u => u.id); };
  const src = () => ['usecase-beta', 'direction LR',
    ...cfg.actors.map(a => `actor ${a.id}(${ml(a.label)})`),
    `systemBoundary sys[${ml(cfg.system)}]`, ...cfg.ucs.map(u => `  ${u.id}(${ml(u.label)})`), 'end',
    ...cfg.ucs.map(u => `${u.owner} -- ${u.id}`),
    ...Object.entries(d.parent).filter(([, p]) => p).map(([c, p]) => `${c} --|> ${p}`)].join('\n');
  const applyFocus = () => spotlight(svgRef, d.focus ? [...chain(d.focus, d.parent), ...abilities(d.focus, d.parent)] : null);
  const frame = DiagramFrame(src(), { title: 'Жива діаграма', caption: 'Клацни на актора на діаграмі, щоб побачити все, що йому доступно.',
    onRender: svg => { svgRef = svg; enableHotspots(svg, hit => setFocus(hit.id), ['actor']); applyFocus(); } });
  const upd = debounce(() => frame.update(src()), 120);
  const rowsEl = h('div', { class: 'hier-rows' }), focusEl = h('div', { class: 'opts' }), pickEl = h('div', { class: 'opts' });
  function setFocus(id) { d.focus = d.focus === id ? null : id; ctx.save(); drawFocus(); applyFocus(); }
  function drawRows() {
    rowsEl.replaceChildren(...cfg.actors.map(a => {
      const v = d.parent[a.id] || '';
      const sel = h('select', { class: 'input', 'aria-label': `${a.label} є різновидом` },
        h('option', { value: '' }, '— нікого (загальний актор)'),
        cfg.actors.filter(x => x.id !== a.id).map(x => h('option', { value: x.id, selected: v === x.id ? true : null }, x.label)));
      sel.addEventListener('change', () => { d.parent[a.id] = sel.value; checked = false; ctx.feedback(null); ctx.save(); drawRows(); upd(); });
      const st = checked ? ((cfg.parent[a.id] || '') === v ? ' ok' : ' bad') : '';
      return h('div', { class: 'hier-row' + st }, h('span', { class: 't-actor' }, a.label), h('span', { class: 'muted' }, 'є різновидом'), sel);
    }));
  }
  function drawFocus() {
    focusEl.replaceChildren(...cfg.actors.map(a => h('button', { class: 'pill-btn kind-actor', type: 'button', 'aria-pressed': String(d.focus === a.id), onclick: () => setFocus(a.id) }, a.label)));
  }
  function drawPick() {
    const right = abilities(cfg.target, cfg.parent);
    pickEl.replaceChildren(...cfg.ucs.map(u => {
      const on = d.pick.includes(u.id);
      return h('button', {
        class: 'pill-btn kind-uc' + (checked ? (on && right.includes(u.id) ? ' ok' : on ? ' bad' : '') : ''), type: 'button', 'aria-pressed': String(on),
        onclick: () => { d.pick = on ? d.pick.filter(x => x !== u.id) : [...d.pick, u.id]; checked = false; ctx.feedback(null); ctx.save(); drawPick(); },
      }, u.label);
    }));
  }
  drawRows(); drawFocus(); drawPick();
  return {
    el: h('div', { class: 'task-body' },
      h('div', { class: 'sub-h' }, h('span', { class: 'n' }, '1'), 'Побудуй ієрархію: хто чиїм різновидом є?'), rowsEl,
      frame,
      h('div', { class: 'sub-h' }, h('span', { class: 'n' }, '2'), 'Перевір успадкування — обери актора:'), focusEl,
      h('div', { class: 'sub-h' }, h('span', { class: 'n' }, '3'), `Що може робити «${label(cfg.target)}»? Обери всі дії.`), pickEl),
    check() {
      checked = true; drawRows(); drawPick();
      const problems = [];
      for (const a of cfg.actors) {
        const v = d.parent[a.id] || '', want = cfg.parent[a.id] || '';
        if (v !== want) problems.push({ ok: false, html: cfg.whyParent[a.id] });
      }
      const right = abilities(cfg.target, cfg.parent);
      if (!sameSet(d.pick, right)) problems.push({ ok: false, html: cfg.whyPick });
      if (!problems.length) return { ok: true, message: cfg.success };
      return { ok: false, message: whyList(problems) };
    },
  };
};
/* Історія з пропусками: читання діаграми, вибір підсвічує елементи */
TASKS.story = (cfg, ctx) => {
  const d = ctx.draft; d.val ||= {};
  let checked = !!ctx.done, svgRef = null;
  const frame = DiagramFrame(cfg.diagram, { title: cfg.diagramTitle || 'Діаграма', onRender: svg => { svgRef = svg; } });
  const story = h('div', { class: 'story' });
  function draw() {
    const parts = cfg.text.split(/\{(\w+)\}/);
    story.replaceChildren(...parts.map((p, i) => {
      if (i % 2 === 0) return p;
      const b = cfg.blanks[p], v = d.val[p];
      const sel = h('select', { 'aria-label': 'Пропуск у тексті', class: checked && v != null ? (v === b.answer ? 'ok' : 'bad') : null },
        h('option', { value: '' }, '…обери…'),
        b.options.map((o, oi) => h('option', { value: String(oi), selected: v === oi ? true : null }, o)));
      sel.addEventListener('change', () => {
        d.val[p] = sel.value === '' ? undefined : Number(sel.value);
        checked = false; sel.className = ''; ctx.feedback(null); ctx.save(); spotlight(svgRef, b.hl);
      });
      sel.addEventListener('focus', () => spotlight(svgRef, b.hl));
      sel.addEventListener('blur', () => spotlight(svgRef, null));
      return sel;
    }));
  }
  draw();
  return {
    el: h('div', { class: 'task-body' }, frame, story),
    check() {
      const keys = Object.keys(cfg.blanks);
      const left = keys.filter(k => d.val[k] == null).length;
      if (left) return { ok: false, tone: 'warn', message: `Заповни всі пропуски — лишилося ${left}.` };
      checked = true; draw();
      const wrong = keys.filter(k => d.val[k] !== cfg.blanks[k].answer);
      if (!wrong.length) return { ok: true, message: cfg.success };
      return { ok: false, message: h('div', {}, h('p', {}, `Правильно ${keys.length - wrong.length} з ${keys.length}. Підказки до червоних пропусків:`),
        whyList(wrong.map(k => ({ ok: false, html: cfg.blanks[k].why })))) };
    },
  };
};

/* Конструктор діаграми з опису + перевірка за еталоном */
TASKS.builder = (cfg, ctx) => {
  const d = ctx.draft; d.actors ||= []; d.ucs ||= []; d.rels ||= [];
  let checked = !!ctx.done, verdict = {};
  const A = id => cfg.actors.find(x => x.id === id), U = id => cfg.ucs.find(x => x.id === id);
  const name = id => (A(id) || U(id))?.label || id;
  const isActor = id => !!A(id);
  const REL = { assoc: 'асоціація', include: 'include', extend: 'extend', gen: 'узагальнення' };
  const keyOf = r => r.t === 'assoc' ? `assoc:${r.a}:${r.b}` : `${r.t}:${r.a}>${r.b}`;
  const src = () => {
    const acts = cfg.actors.filter(a => d.actors.includes(a.id)), ucs = cfg.ucs.filter(u => d.ucs.includes(u.id));
    if (!acts.length && !ucs.length) return 'usecase-beta\nEmpty("Тут з’явиться твоя діаграма")';
    const lines = ['usecase-beta', 'direction LR', ...acts.map(a => `actor ${a.id}(${ml(a.label)})${a.sys ? ' <<system>>' : ''}`)];
    if (ucs.length) lines.push(`systemBoundary sys[${ml(cfg.system)}]`, ...ucs.map(u => `  ${u.id}(${ml(u.label)})`), 'end');
    for (const r of d.rels) {
      if (r.t === 'assoc') lines.push(A(r.a)?.sys ? `${r.b} -- ${r.a}` : `${r.a} -- ${r.b}`);
      else if (r.t === 'gen') lines.push(`${r.a} --|> ${r.b}`);
      else lines.push(`${r.a} ..> : ${r.t} ${r.b}`);
    }
    return lines.join('\n');
  };
  const frame = DiagramFrame(src(), { title: 'Твоя діаграма' });
  const upd = debounce(() => frame.update(src()), 140);
  const actEl = h('div', { class: 'opts' }), ucEl2 = h('div', { class: 'opts' }), relList = h('ul', { class: 'rel-list' });
  const selFrom = h('select', { class: 'input', 'aria-label': 'Від елемента' }), selType = h('select', { class: 'input', 'aria-label': 'Тип зв’язку' }), selTo = h('select', { class: 'input', 'aria-label': 'До елемента' });
  const formErr = h('div', { class: 'field-error', 'aria-live': 'polite' });
  Object.entries(REL).forEach(([k, v]) => selType.append(h('option', { value: k }, v)));
  const touch = () => { checked = false; verdict = {}; ctx.feedback(null); ctx.save(); draw(); upd(); };
  function toggle(list, id) {
    const on = d[list].includes(id);
    d[list] = on ? d[list].filter(x => x !== id) : [...d[list], id];
    if (on) d.rels = d.rels.filter(r => r.a !== id && r.b !== id);
    touch();
  }
  function fillSelects() {
    const els = [...cfg.actors.filter(a => d.actors.includes(a.id)), ...cfg.ucs.filter(u => d.ucs.includes(u.id))];
    for (const s of [selFrom, selTo]) {
      const keep = s.value;
      s.replaceChildren(h('option', { value: '' }, s === selFrom ? 'Від…' : 'До…'), ...els.map(e => h('option', { value: e.id }, e.label)));
      if (els.some(e => e.id === keep)) s.value = keep;
    }
  }
  function addRel() {
    let a = selFrom.value, b = selTo.value, t = selType.value;
    const err = m => { formErr.textContent = m; };
    if (!a || !b) return err('Обери обидва елементи.');
    if (a === b) return err('Елемент не можна з’єднати сам із собою.');
    if (t === 'assoc') {
      if (isActor(a) === isActor(b)) return err('Асоціація з’єднує актора з варіантом використання.');
      if (!isActor(a)) [a, b] = [b, a];
    } else if (t === 'gen') {
      if (isActor(a) !== isActor(b)) return err('Узагальнення можливе лише між двома акторами або двома варіантами використання.');
    } else if (isActor(a) || isActor(b)) return err(`«${t}» з’єднує лише варіанти використання.`);
    const r = { t, a, b };
    if (d.rels.some(x => keyOf(x) === keyOf(r))) return err('Такий зв’язок уже є.');
    formErr.textContent = '';
    d.rels.push(r); touch();
  }
  function draw() {
    actEl.replaceChildren(...cfg.actors.map(a => {
      const on = d.actors.includes(a.id);
      return h('button', { class: 'pill-btn kind-actor' + (checked && on ? (a.ok ? ' ok' : ' bad') : ''), type: 'button', 'aria-pressed': String(on), onclick: () => toggle('actors', a.id) }, a.label);
    }));
    ucEl2.replaceChildren(...cfg.ucs.map(u => {
      const on = d.ucs.includes(u.id);
      return h('button', { class: 'pill-btn kind-uc' + (checked && on ? (u.ok ? ' ok' : ' bad') : ''), type: 'button', 'aria-pressed': String(on), onclick: () => toggle('ucs', u.id) }, u.label);
    }));
    relList.replaceChildren(...(d.rels.length ? d.rels.map((r, i) => h('li', { class: verdict[keyOf(r)] || '' },
      h('span', {}, name(r.a)), h('span', { class: 'rel-type ' + r.t }, r.t === 'assoc' ? '——' : r.t === 'gen' ? '—▷' : `··> ${r.t}`), h('span', { class: 'grow' }, name(r.b)),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Видалити зв’язок', onclick: () => { d.rels.splice(i, 1); touch(); } }, icon('trash', 16)))) :
      [h('li', { class: 'subtle', style: { justifyContent: 'center' } }, 'Зв’язків ще немає — додай їх формою вище.')]));
    fillSelects();
  }
  draw();
  return {
    el: h('div', { class: 'task-body' },
      h('div', { class: 'brief', html: cfg.brief }),
      h('div', { class: 'builder' },
        h('div', { class: 'palette' }, h('h4', {}, icon('actor', 16), 'Актори'), actEl),
        h('div', { class: 'palette' }, h('h4', {}, icon('ellipse', 16), 'Варіанти використання'), ucEl2)),
      h('div', { class: 'rel-form' },
        h('div', { class: 'field' }, h('label', {}, 'Від'), selFrom),
        h('div', { class: 'field' }, h('label', {}, 'Тип'), selType),
        h('div', { class: 'field' }, h('label', {}, 'До'), selTo),
        h('button', { class: 'btn btn-secondary', type: 'button', onclick: addRel }, icon('plus', 18), 'Додати')),
      formErr, relList, frame),
    check() {
      checked = true; verdict = {};
      const out = [];
      const missA = cfg.actors.filter(a => a.ok && !d.actors.includes(a.id)), badA = cfg.actors.filter(a => !a.ok && d.actors.includes(a.id));
      const missU = cfg.ucs.filter(u => u.ok && !d.ucs.includes(u.id)), badU = cfg.ucs.filter(u => !u.ok && d.ucs.includes(u.id));
      badA.forEach(a => out.push({ ok: false, html: item(a.label, a.why) }));
      badU.forEach(u => out.push({ ok: false, html: item(u.label, u.why) }));
      if (missA.length) out.push({ ok: false, html: `Бракує ${missA.length} ${plural(missA.length, 'актора', 'акторів', 'акторів')} — перечитай опис: хто ще взаємодіє із системою?` });
      if (missU.length) out.push({ ok: false, html: `Бракує ${missU.length} ${plural(missU.length, 'варіанта', 'варіантів', 'варіантів')} використання — які ще цілі згадано в описі?` });
      const req = cfg.required.map(keyOf), allow = (cfg.allowed || []).map(keyOf), have = d.rels.map(keyOf);
      for (const r of d.rels) {
        const k = keyOf(r);
        if (req.includes(k) || allow.includes(k)) { verdict[k] = 'ok'; continue; }
        verdict[k] = 'bad';
        const rev = keyOf({ ...r, a: r.b, b: r.a });
        if ((r.t === 'include' || r.t === 'extend') && req.includes(rev)) out.push({ ok: false, html: `<b>${escHtml(name(r.a))} → ${escHtml(name(r.b))}</b> (${r.t}) — напрямок навпаки. ${r.t === 'include' ? 'Стрілка include іде від базового варіанта використання до включеного.' : 'Стрілка extend іде від розширення до базового.'}` });
        else {
          const sameT = cfg.required.find(x => x.a === r.a && x.b === r.b) || cfg.required.find(x => x.a === r.b && x.b === r.a);
          out.push({ ok: false, html: sameT ? `<b>${escHtml(name(r.a))} — ${escHtml(name(r.b))}</b>: зв’язок потрібен, але іншого типу.` : `<b>${escHtml(name(r.a))} — ${escHtml(name(r.b))}</b> (${REL[r.t]}): за описом такого зв’язку немає.` });
        }
      }
      const missR = cfg.required.filter(r => !have.includes(keyOf(r)) && d.actors.concat(d.ucs).includes(r.a) && d.actors.concat(d.ucs).includes(r.b));
      const missRHidden = cfg.required.filter(r => !have.includes(keyOf(r))).length - missR.length;
      if (missR.length) out.push({ ok: false, html: `Бракує ${missR.length} ${plural(missR.length, 'зв’язку', 'зв’язків', 'зв’язків')} між уже доданими елементами. ${cfg.relHint || ''}` });
      draw();
      if (!out.length && !missRHidden) return { ok: true, message: cfg.success };
      if (!out.length) out.push({ ok: false, html: 'Додай решту елементів і зв’язків з опису.' });
      return { ok: false, message: h('div', {}, h('p', {}, 'Що варто виправити:'), whyList(out)) };
    },
  };
};

const svgIco = (name, size = 18) => `<span class="ico"><svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg></span>`;
const callout = (kind, title, body) => `<div class="callout ${kind}">${svgIco({ remember: 'bulb', mistake: 'alert', tip: 'sparkles' }[kind])}<h4>${title}</h4><div>${body}</div></div>`;
const dg = key => `<div data-diagram="${key}"></div>`;
const lines = (...ls) => ls.flat(Infinity).filter(x => x != null && x !== false && x !== '').join('\n');
const COURSE = { modules: [] };
const addModule = (id, title, desc) => { const m = { id, title, desc, lessons: [] }; COURSE.modules.push(m); return m; };

/* ---------------- Модуль 1. Знайомство ---------------- */
const m1 = addModule('m1', 'Знайомство', 'Що таке діаграма варіантів використання і з чого вона складається.');

m1.lessons.push({
  id: '1-1', title: 'Навіщо потрібна діаграма варіантів використання', minutes: 4,
  theory: `
<p><b>UML</b> (Unified Modeling Language) — стандартна графічна мова, якою аналітики, розробники й замовники «малюють» програмні системи. В UML 14 видів діаграм, і одна з найпростіших та найкорисніших — <b>діаграма варіантів використання</b> (англ. <i>use case diagram</i>; у старших підручниках — «діаграма прецедентів»).</p>
<p>Вона відповідає лише на два питання: <b>хто</b> користується системою і <b>що</b> система для них робить. Тут немає кнопок, таблиць бази даних чи алгоритмів — тільки ролі та їхні цілі. Тому таку діаграму розуміють і програміст, і замовник без технічної освіти.</p>

${dg('good')}

  task: {

const ALL_LESSONS = COURSE.modules.flatMap(m => m.lessons.map(l => Object.assign(l, { module: m })));
const lessonById = id => ALL_LESSONS.find(l => l.id === id);
const lessonIdx = id => ALL_LESSONS.findIndex(l => l.id === id);
const isDone = id => Store.state.lessons[id]?.status === 'done';
const isUnlocked = id => { const i = lessonIdx(id); return i === 0 || isDone(id) || isDone(ALL_LESSONS[i - 1].id); };
const doneCount = () => ALL_LESSONS.filter(l => isDone(l.id)).length;
const courseProgress = () => Math.round(100 * doneCount() / ALL_LESSONS.length);
const allLessonsDone = () => doneCount() === ALL_LESSONS.length;
const nextLesson = () => ALL_LESSONS.find(l => !isDone(l.id)) || null;
const lessonNum = l => l.id.replace('-', '.');

const capFirst = s => s.charAt(0).toLocaleUpperCase('uk') + s.slice(1);

function validateName(first, last) {
  const clean = s => String(s || '').replace(/\s+/g, ' ').trim();
  const f = clean(first), l = clean(last);
  const re = /^\p{L}[\p{L}'’ʼ\- ]{1,39}$/u;
  if (!f) return { error: 'Введи ім’я.', field: 'first' };
  if (!re.test(f)) return { error: 'Ім’я: від 2 до 40 символів — літери, апостроф, дефіс.', field: 'first' };
  if (!l) return { error: 'Введи прізвище.', field: 'last' };
  if (!re.test(l)) return { error: 'Прізвище: від 2 до 40 символів — літери, апостроф, дефіс.', field: 'last' };
  return { first: capFirst(f), last: capFirst(l) };
}

const bankQ = id => TEST_BANK.find(q => q.id === id);
let timerId = null;
function stopTimer() { clearInterval(timerId); timerId = null; }
function startTimer(update) {
  stopTimer();
  const tick = () => {
    const cur = Store.state.test.current;
    if (!cur) { stopTimer(); return; }
    const left = cur.deadline - Date.now();
    update(left);
    if (left <= 0) submitTest(true);
  };
  tick();
  timerId = setInterval(tick, 500);
}

function startTest() {
  const byTopic = {};
  for (const q of TEST_BANK) (byTopic[q.topic] ||= []).push(q);
  const pick = [];
  for (const list of Object.values(byTopic)) pick.push(...shuffle(list).slice(0, 2));
  pick.push(...shuffle(TEST_BANK.filter(q => !pick.includes(q))).slice(0, Math.max(0, CONFIG.test.questions - pick.length)));
  const qs = shuffle(pick).slice(0, CONFIG.test.questions);
  const now = Date.now();
  Store.state.test.current = {
    startedAt: now, deadline: now + CONFIG.test.minutes * 60000,
    qids: qs.map(q => q.id),
    order: Object.fromEntries(qs.filter(q => q.options).map(q => [q.id, shuffle(q.options.map(o => o.id))])),
    answers: {}, hotLabels: {}, flags: [], index: 0, updatedAt: now,
  };
  Store.save();
}
const gradeQ = (q, ans) => !!ans?.length && (q.type === 'multi' ? sameSet(ans, q.correct) : q.correct.includes(ans[0]));
function submitTest(expired = false) {
  stopTimer();
  /* Підхоплюємо зміни з інших вкладок: тест могли вже здати там */
  Store.sync();
  const cur = Store.state.test.current;
  if (!cur) { go('/results'); return; }
  const submittedAt = expired ? Math.min(Date.now(), cur.deadline) : Date.now();
  const qs = cur.qids.map(bankQ).filter(Boolean);
  const correct = qs.filter(q => gradeQ(q, cur.answers[q.id])).map(q => q.id);
  const percent = qs.length ? Math.round(100 * correct.length / qs.length) : 0;
  const prof = Store.state.profile || {};
  const n = (attempts().at(-1)?.n || 0) + 1;
  attempts().push({
    n, startedAt: cur.startedAt, submittedAt, durationSec: Math.round((submittedAt - cur.startedAt) / 1000),
    qids: cur.qids, order: cur.order, answers: cur.answers, hotLabels: cur.hotLabels || {},
    correct, score: correct.length, total: qs.length, percent, passed: percent >= CONFIG.test.passPercent,
    expired, name: `${prof.firstName || ''} ${prof.lastName || ''}`.trim(), courseProgress: courseProgress(),
  });
  Store.state.test.current = null;
  Store.save(true);
  if (percent >= CONFIG.test.passPercent) setTimeout(() => confetti(220), 300);
  location.hash = `#/results/${n}`;
}

const SYNTAX_DEMO = lines('usecase-beta', 'direction LR', 'actor Client("Клієнт")', 'actor Bank("Банк") <<system>>',
  'systemBoundary shop["Інтернет-магазин"]', '  Order("Оформити замовлення")', '  Pay("Оплатити")', '  Promo("Застосувати промокод")', 'end',

  return h('div', { class: 'page wide view-enter' },

        syntax.map(([c, t]) => h('tr', {}, h('td', {}, h('code', {}, c)), h('td', {}, t))))),
      DiagramFrame(SYNTAX_DEMO, { title: 'Приклад — відкрий код кнопкою </>', caption: 'Натисни кнопку коду над діаграмою, щоб побачити й скопіювати запис Mermaid.' })));
}
/* =====================================================================
   РОУТЕР І ЗАПУСК
   ===================================================================== */
const go = path => { history.replaceState(null, '', '#' + path); render(); };
let lastRoute = '';
/* sync: оновлення через зміни з іншої вкладки — без анімації появи і зі збереженням прокрутки */
function render({ sync = false } = {}) {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const s = Store.state;
  const route = parts.join('/');
  const changed = route !== lastRoute;
  const scrollY = window.scrollY;
  lastRoute = route;
  if (s.test.current && Date.now() >= s.test.current.deadline) { submitTest(true); return; }
  if (!s.test.current) stopTimer();
  const mount = (node, opts = {}) => mountPage(node, { ...opts, animate: !sync });
  if (!s.profile) {
    if (parts[0] !== 'welcome') return go('/welcome');
    document.title = 'Use Case з нуля — курс з діаграм варіантів використання UML';
    return mount(WelcomeView(), { shell: false });
  }
  if (s.test.current && parts[0] !== 'test') return go('/test');
  const title = t => { document.title = `${t} — Use Case з нуля`; };
  switch (parts[0]) {
    case undefined:
      title('Головна'); mount(HomeView(), { active: 'home' }); break;
    case 'lesson': {
      const l = lessonById(parts[1]);
      if (!l) return go('/');
      if (!isUnlocked(l.id)) return go(`/lesson/${(nextLesson() || ALL_LESSONS[0]).id}`);
      title(`${lessonNum(l)} ${l.title}`);
      mount(LessonView(l.id, parts[2] === 'practice' ? 'practice' : 'theory'), { active: l.id });
      break;
    }
    case 'cheatsheet':
      title('Шпаргалка'); mount(CheatsheetView(), { active: 'cheatsheet' }); break;
    case 'test':
      if (s.test.current) { title('Фінальний тест'); mount(TestRunView(), { focus: true, active: 'test' }); }
      else { title('Фінальний тест'); mount(TestIntroView(), { active: 'test' }); }
      break;
    case 'results': {
      const view = ResultsView(parts[1] ? Number(parts[1]) : null);
      if (!view) return go('/test');
      title('Результат тесту'); mount(view, { active: 'test' });
      break;
    }
    default: return go('/');
  }
  if (changed) window.scrollTo(0, 0);
  else if (sync) window.scrollTo(0, scrollY);
}

window.addEventListener('hashchange', () => render());

/* Курс може бути відкритий у кількох вкладках. Зміни з іншої вкладки підхоплюємо,
   коли ця вкладка активна: зливаємо їх із власним прогресом (нічого не відкочується)
   і перемальовуємо сторінку лише тоді, коли щось справді змінилося. Якщо інша вкладка
   (наприклад, стара версія курсу) затерла наш прогрес, повертаємо його у сховище. */
let staleFromOtherTab = false;
function syncFromOtherTab() {
  staleFromOtherTab = false;
  const { changed, heal } = Store.sync();
  if (heal) Store.save(true);
  if (changed) Store.quietly(() => render({ sync: true }));
}
window.addEventListener('storage', e => {
  if (e.key === CONFIG.themeKey) { Theme.sync(); return; }
  if (e.key !== CONFIG.storageKey && e.key !== null) return;
  if (document.hasFocus()) syncFromOtherTab();
  else staleFromOtherTab = true;
});
window.addEventListener('focus', () => { if (staleFromOtherTab) syncFromOtherTab(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && staleFromOtherTab && document.hasFocus()) syncFromOtherTab(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') app.classList.remove('nav-open'); });

Store.load();
render();
requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('no-anim')));
/* Mermaid підвантажується у фоні одразу після першого малювання */
setTimeout(() => Diagrams.load().catch(() => {}), 0);
/* Для перевірки: усі діаграми курсу через mermaid.parse() */
window.ucSelfTest = async () => {
  const srcs = [WELCOME_DIAGRAM, SYNTAX_DEMO, ...CHEATS.map(c => c.src), ...TEST_BANK.filter(q => q.diagram).map(q => q.diagram)];
  for (const l of ALL_LESSONS) {
    srcs.push(...Object.values(l.diagrams || {}).map(d => d.src));
    const t = l.task;
    if (t.diagram && typeof t.diagram === 'string') srcs.push(t.diagram);
    (t.cards || []).forEach(c => c.diagram && srcs.push(typeof c.diagram === 'function' ? c.diagram() : c.diagram));
  }
  const errors = [];
  for (const src of srcs) { try { await Diagrams.parse(src); } catch (e) { errors.push({ src: src.slice(0, 80), error: String(e.message || e).slice(0, 200) }); } }
  return { total: srcs.length, errors };
};
